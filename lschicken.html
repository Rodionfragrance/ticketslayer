<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>LS-Chicken</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=Chakra+Petch:wght@400;600;700&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
<style>
/* Leitstand-Monitor um einen Hähnchenwagen: Spielfeld als ein Canvas, Abend/Kassenbon/Peter als DOM-Overlays */
:root{
  --bg:#121a1b; --panel:#1d2829; --panel2:#253334; --line:#36494a;
  --fg:#e9e3cf; --dim:#8ea19e; --grill:#f0a03a; --ketchup:#d9472f; --phos:#7fd6a6; --mayo:#f4ebc9; --paper:#f6f1e1; --ink:#2a2622;
  --f-disp:'Silkscreen',ui-monospace,monospace;
  --f-body:'Chakra Petch',system-ui,sans-serif;
  --f-bon:'Courier Prime','Courier New',monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;margin:0;overflow:hidden}
#wrap{position:fixed;inset:0;display:grid;place-items:center;padding:12px 16px}
#cv{display:block;border:1px solid var(--line);background:var(--bg);cursor:pointer;max-width:100%}
.ov{position:fixed;inset:0;background:rgba(9,13,14,.9);display:flex;justify-content:center;align-items:flex-start;overflow:auto;padding:28px 16px;z-index:5}
.ov[hidden]{display:none!important}
.card{background:var(--panel);border:1px solid var(--line);padding:22px;max-width:1080px;width:100%;min-width:0}
h1,h2,h3{font-family:var(--f-disp);font-weight:700;letter-spacing:.04em;margin:0;text-wrap:balance}
h1{font-size:44px;color:var(--grill)}
h2{font-size:22px;color:var(--grill)}
h3{font-size:14px;color:var(--phos);letter-spacing:.08em;text-transform:uppercase}
p{margin:0;line-height:1.5}
.dim{color:var(--dim)}
.btn{font:600 15px var(--f-body);background:var(--panel2);color:var(--fg);border:1px solid var(--line);padding:9px 16px;cursor:pointer}
.btn:hover{border-color:var(--grill)}
.btn:focus-visible{outline:2px solid var(--phos);outline-offset:2px}
.btn.go{background:var(--grill);color:var(--ink);border-color:var(--grill);font-family:var(--f-disp);font-size:16px}
.btn.go:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.sm{padding:3px 9px;font-size:13px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.stack{display:flex;flex-direction:column;gap:14px;min-width:0}
.grid2{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:22px}
@media (max-width:820px){.grid2{grid-template-columns:1fr}}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:6px 6px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-weight:600;color:var(--dim);font-size:12px;letter-spacing:.06em;text-transform:uppercase}
td:first-child,th:first-child{text-align:left}
.tbl{overflow-x:auto}
.qty{width:52px;font:600 15px var(--f-body);background:var(--bg);color:var(--fg);border:1px solid var(--line);text-align:center;padding:4px}
.bar{height:8px;background:var(--bg);border:1px solid var(--line)}
.bar>i{display:block;height:100%;background:var(--phos)}
.bar.warn>i{background:var(--ketchup)}
.peter{display:flex;gap:14px;align-items:flex-end}
.peter img{height:120px;flex:none}
.speech{background:var(--paper);color:var(--ink);padding:10px 12px;font-size:14px;line-height:1.4;position:relative;flex:1;min-width:0}
.fc{font-family:var(--f-disp);font-size:18px;color:var(--mayo)}
.up{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.up small{color:var(--dim);display:block;font-size:12.5px}
.tog{display:flex;gap:10px;align-items:flex-start;cursor:pointer;font-size:14px;line-height:1.35}
.tog input{margin-top:3px;accent-color:var(--grill)}
.spark{display:flex;gap:2px;align-items:flex-end;height:22px}
.spark i{display:block;width:6px;background:var(--phos);min-height:1px}
/* Kassenbon */
.bon{background:var(--paper);color:var(--ink);font-family:var(--f-bon);max-width:420px;width:100%;padding:26px 24px 30px;font-size:14px;line-height:1.45;box-shadow:0 12px 40px rgba(0,0,0,.5);
  -webkit-mask:linear-gradient(135deg,#0000 6px,#000 0) bottom left/12px 12px repeat-x,linear-gradient(#000 0 0) top/100% calc(100% - 10px) no-repeat;
          mask:conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) bottom/14px 10px repeat-x,linear-gradient(#000 0 0) top/100% calc(100% - 10px) no-repeat}
.bon .c{text-align:center}
.bon .l{display:flex;justify-content:space-between;gap:10px;font-variant-numeric:tabular-nums}
.bon hr{border:0;border-top:1px dashed var(--ink);margin:8px 0}
.bon .big{font-size:20px;font-weight:700}
.bon .neg{color:#9b2b1b}
.title{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:28px;align-items:center}
@media (max-width:820px){.title{grid-template-columns:1fr}}
.cartbox{position:relative;max-width:520px;width:100%}
.cartbox img{width:100%;display:block}
.cartbox b{position:absolute;left:22.5%;top:17%;width:46%;text-align:center;font-family:var(--f-disp);color:#7a2a1c;font-size:clamp(14px,3.6vw,30px);line-height:1.05}
.keys{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;font-size:14px}
kbd{font-family:var(--f-disp);font-size:12px;background:var(--bg);border:1px solid var(--line);padding:1px 6px;color:var(--mayo)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

const blank = ()=>Object.fromEntries(P.map(p=>[p,0]));

/* ===================== Persistenz ===================== */
const SKEY='lschicken_v1';
function loadStore(){ try{ return JSON.parse(localStorage.getItem(SKEY))||{}; }catch(e){ return {}; } }
function saveStore(){ try{ localStorage.setItem(SKEY, JSON.stringify(STORE)); }catch(e){} }
let STORE = loadStore();
STORE.life = STORE.life || {sold:blank(), waste:blank(), revenue:0, days:0, runs:0, served:0, lost:0, stolen:0};
STORE.best = STORE.best || [];   // [{days, revenue, date}]

/* ===================== Spielzustand ===================== */
let S = null;
function newRun(){
  S = {
    day:1, cash:400, ruf:60, time:0, phase:'day',
    stock:{huhn:[{q:12,age:0,cheap:false}],haxe:[{q:3,age:0,cheap:false}],wurst:[{q:20,age:0,cheap:false}],pommes:[{q:30,age:0,cheap:false}],salat:[{q:6,age:0,cheap:false}]},
    spiess:[], rost:[], fry:[], aus:blank2(), queue:[],
    up:Object.fromEntries(Object.entries(UPG).map(([k,u])=>[k,u.start])),
    upBought:blank3(),
    auto:false, aCd:3, salatPrep:0, kl:{x:1010,job:null,t:0}, jobs:[],
    fuel:0, wt:0, streak:0,
    event:EVENTS[0], forecast:EVENTS[0],
    order:null, cheapNext:false, reheat:false,
    raids:[], raid:null,
    run:{sold:blank(), waste:blank(), revenue:0, served:0, lost:0, stolen:0},
    hist:[],
    day_:null,
  };
  STORE.life.runs++; saveStore();
  startDay(true);
}
function blank2(){ return Object.fromEntries(P.map(p=>[p,[]])); }
function blank3(){ return Object.fromEntries(Object.keys(UPG).map(k=>[k,0])); }

function newDayStats(){ return {n:S.day, sold:blank(), waste:blank(), why:{verbrannt:0,lasch:0,verdorben:0,uebrig:0,gestohlen:0,kloska:0}, revenue:0, tips:0, served:0, lost:0, missed:0, reheatSold:0, perfect:0, complaints:0, cost:{}}; }

/* ===================== Lager ===================== */
const stockCount = p => S.stock[p].reduce((a,b)=>a+b.q,0);
const stockTotal = () => P.reduce((a,p)=>a+stockCount(p),0);
function takeStock(p,n){
  if (stockCount(p) < n) return null;
  let cheap=false;
  while(n>0){ const b=S.stock[p][0]; const t=Math.min(b.q,n); b.q-=t; n-=t; if(b.cheap) cheap=true; if(b.q<=0) S.stock[p].shift(); }
  return {cheap};
}

/* ===================== Tagesablauf ===================== */
function startDay(first){
  S.phase='day'; S.time=0; S.queue=[]; S.spawnAcc=0; S.raid=null;
  S.day_ = newDayStats();
  if (S.order){ for(const p of P){ if(S.order[p]>0) S.stock[p].push({q:S.order[p],age:0,cheap:p==='huhn'&&S.cheapNext}); } }
  S.order=null;
  S.event = Math.random()<0.8 ? S.forecast : pick(EVENTS.filter(e=>!e.minDay||e.minDay<=S.day));
  // Max & Moritz
  S.raids=[];
  if (S.day>=3 && Math.random()< Math.min(0.85,0.45+S.day*0.03)){ const n = S.day>=10 && Math.random()<0.5 ? 2 : 1; for(let i=0;i<n;i++) S.raids.push(rnd(40,DAYLEN-30)); }
  S.kl={x:1010,job:null,t:0}; S.jobs=[];
  // Darius-Panne
  if (S.day>=3 && Math.random()<0.06){ const n=Math.floor(stockCount('huhn')*0.3); if(n>0){ takeStock('huhn',n); S.day_.waste.huhn+=n; S.day_.why.verdorben+=n; sayM('DARIUS hat die Kühlung ausgesteckt. Wieso darf der überhaupt ins Lager?'); log(`Darius hat die Kühlung ausgesteckt: ${n} Hühner verdorben.`);} }
  sayM(first?'Willkommen bei LS-Chicken. Ich bin Maddin. Hier wird geliefert.':pick(SAY_M.start));
  log(`Tag ${S.day}: ${S.event.name}`);
  hideAll(); paused=false;
}

function endDay(reason){
  if (S.phase!=='day') return;
  S.phase='bon';
  if (S.kl.job){ finishSale(S.kl.job); S.kl.job=null; } S.jobs.splice(0).forEach(finishSale);
  const d=S.day_;
  const toss=(p,n,why)=>{ if(n>0){ d.waste[p]+=n; d.why[why]+=n; } };
  // Spieß: gare Ware wandert in die Auslage-Reste
  for(const it of S.spiess){ if(!it) continue; const c=COOK[it.p]; if(it.t>=c.done && it.t<c.burn) S.aus[it.p].push({perf:false,age:0,re:false,cheap:it.cheap}); else toss(it.p,1, it.t>=c.burn?'verbrannt':'uebrig'); }
  S.spiess=[];
  for(const w of S.rost){ if(w) toss('wurst',1,'uebrig'); } S.rost=[];
  for(const b of S.fry){ if(b) toss('pommes',POMMES_BATCH,'uebrig'); } S.fry=[];
  for(const p of ['huhn','haxe']){
    const keep=[];
    for(const it of S.aus[p]){ if(S.reheat && !it.re) keep.push({perf:false,age:0,re:true,cheap:it.cheap}); else toss(p,1,'uebrig'); }
    S.aus[p]=keep;
  }
  for(const p of ['wurst','pommes','salat']){ toss(p,S.aus[p].length,'uebrig'); S.aus[p]=[]; }
  // Rohware altert
  for(const p of P){ for(const b of S.stock[p]) b.age++; const bad=S.stock[p].filter(b=>b.age>=SPOIL[p]); for(const b of bad) toss(p,b.q,'verdorben'); S.stock[p]=S.stock[p].filter(b=>b.age<SPOIL[p]); }
  // Kosten
  const c=d.cost;
  c.stand = 50 + S.day*4;
  c.energie = 15 + (S.up.spiess+S.up.rost)*2 + S.up.fry*8;
  c.auto = S.auto ? 60 : 0;
  c.strafe = 0;
  if (d.reheatSold>0 && Math.random()<Math.min(0.85,0.12*d.reheatSold)){ c.strafe = 120+S.day*10; S.ruf=clamp(S.ruf-15,0,100); d.kontrolle=true; }
  const sum = c.stand+c.energie+c.auto+c.strafe;
  S.cash -= sum;
  d.costSum=sum; d.cashEnd=S.cash; d.ruf=S.ruf; d.event=S.event.name;
  // Tracking
  for(const p of P){ S.run.sold[p]+=d.sold[p]; S.run.waste[p]+=d.waste[p]; STORE.life.sold[p]+=d.sold[p]; STORE.life.waste[p]+=d.waste[p]; }
  S.run.revenue+=d.revenue; S.run.served+=d.served; S.run.lost+=d.lost+d.missed; S.run.stolen+=d.why.gestohlen;
  STORE.life.revenue+=d.revenue; STORE.life.days++; STORE.life.served+=d.served; STORE.life.lost+=d.lost+d.missed; STORE.life.stolen+=d.why.gestohlen;
  S.hist.push({n:d.n, sold:{...d.sold}, waste:{...d.waste}, revenue:d.revenue, ev:S.event.id});
  if (S.hist.length>30) S.hist.shift();
  S.over = reason==='ruf' || S.ruf<=0 ? 'ruf' : S.cash<0 ? 'pleite' : null;
  // Prognose für morgen
  S.day++;
  const pool=EVENTS.filter(e=>!e.minDay||e.minDay<=S.day);
  S.forecast = Math.random()<0.45 ? EVENTS[0] : pick(pool);
  if (S.over){ recordBest(); STORE.run=null; } else { STORE.run=S; }
  saveStore();
  showBon(d);
}

function recordBest(){
  STORE.best.push({days:S.day-1, revenue:Math.round(S.run.revenue), date:new Date().toLocaleDateString('de-DE')});
  STORE.best.sort((a,b)=>b.days-a.days||b.revenue-a.revenue); STORE.best=STORE.best.slice(0,8);
}

/* ===================== Kundschaft ===================== */
const CURVE=[0.6,0.9,1.7,1.5,0.8,0.7,1.0,1.4]; const CMEAN=CURVE.reduce((a,b)=>a+b)/CURVE.length;
function custPerDay(){ return (16 + S.day*2.2) * S.event.cust * (0.5+S.ruf/100) * (1+S.up.schild*0.12); }
function weightOf(p,base){ return base*(S.event.mult[p]??1); }
function makeOrder(){
  const o={};
  const mains=[['huhn',45],['wurst',30],['haxe',12],['salat',13]].map(([p,w])=>[p,weightOf(p,w)]);
  let tot=mains.reduce((a,b)=>a+b[1],0), r=Math.random()*tot, m='huhn';
  for(const [p,w] of mains){ if((r-=w)<=0){m=p;break;} }
  o[m]= (S.day>=5 && Math.random()<0.15) ? 2 : 1;
  if (Math.random()<0.6*(S.event.mult.pommes??1) && m!=='salat') o.pommes=(o.pommes||0)+1;
  else if (Math.random()<0.18*(S.event.mult.salat??1)) o.salat=(o.salat||0)+1;
  return o;
}
function spawnCustomer(){
  if (S.queue.length>=QMAX){ S.day_.missed++; S.ruf=clamp(S.ruf-1,0,100); return; }
  const pat=Math.max(20,40-S.day*0.4);
  S.queue.push({o:makeOrder(), pat, max:pat, spr:Math.random()<0.5?'wurmL':'wurmR', bob:rnd(0,6), x:W+60});
}
const canServe = c => !c.res && Object.entries(c.o).every(([p,n])=>S.aus[p].length>=n);
function reserve(c){
  if(!c||!canServe(c)) return false;
  c.items=[]; for(const [p,n] of Object.entries(c.o)) for(let k=0;k<n;k++) c.items.push([p,S.aus[p].shift()]);
  c.res=true; S.jobs.push(c); return true;
}
function serve(i){ return reserve(S.queue[i]); }
function finishSale(c){
  const i=S.queue.indexOf(c), x=i>=0?qx(i):S.kl.x;
  let sum=0, allPerf=true, cheap=0, re=0;
  for(const [p,it] of c.items){ sum+=PRICE[p]; if(!it.perf) allPerf=false; if(it.cheap) cheap++; if(it.re) re++; S.day_.sold[p]++; }
  const tip = allPerf ? sum*0.15 : 0;
  S.cash+=sum+tip; S.day_.revenue+=sum+tip; S.day_.tips+=tip; S.day_.served++; S.day_.reheatSold+=re;
  S.ruf=clamp(S.ruf+(allPerf?1.2:0.4),0,100);
  if (allPerf){ S.fuel=clamp(S.fuel+5,0,100); }
  if (cheap>0 && Math.random()<0.18*cheap){ S.ruf=clamp(S.ruf-3,0,100); S.day_.complaints++; float(x,150,'Schmeckt komisch…',C.ketchup); }
  float(x,130,'+'+eur(sum+tip)+(allPerf?' ★':''),allPerf?C.phos:C.mayo);
  if (i>=0) S.queue.splice(i,1);
}
const qx = i => 820 + i*76;

/* ===================== Aktionen ===================== */
function loadSpiess(p,slot){
  const i=Number.isInteger(slot)?slot:firstFree(S.spiess,S.up.spiess); if(i<0){ float(230,90,'Spieß voll',C.ketchup); return; }
  const s=takeStock(p,1); if(!s){ float(230,90,`Keine ${RAW[p]} mehr!`,C.ketchup); return; }
  S.spiess[i]={p,t:0,cheap:s.cheap};
}
function loadRost(slot){
  const i=Number.isInteger(slot)?slot:firstFree(S.rost,S.up.rost); if(i<0){ float(615,90,'Rost voll',C.ketchup); return; }
  if(!takeStock('wurst',1)){ float(615,90,'Keine Würste mehr!',C.ketchup); return; }
  S.rost[i]={t:0,side:1,pf:false,burnt:false};
}
function loadFry(){
  const i=firstFree(S.fry,S.up.fry); if(i<0){ float(615,260,'Fritteuse belegt',C.ketchup); return; }
  if(!takeStock('pommes',POMMES_BATCH)){ float(615,260,'Zu wenig Pommes',C.ketchup); return; }
  S.fry[i]={t:0};
}
function prepSalat(){
  if (S.salatPrep>0) return;
  if(!takeStock('salat',1)){ float(670,560,'Kein Salat mehr!',C.ketchup); return; }
  S.salatPrep=SALAT_PREP;
}
function firstFree(arr,n){ for(let i=0;i<n;i++) if(!arr[i]) return i; return -1; }

function takeSpiess(i){
  const it=S.spiess[i]; if(!it) return;
  const c=COOK[it.p], sx=slotSpiess(i);
  if (it.t<c.done){ float(sx.x+48,sx.y+40,'noch roh',C.dim); return; }
  S.spiess[i]=null;
  if (it.t>=c.burn){ burnt(it.p,1,sx.x+48,sx.y+40); return; }
  const perf=it.t<=c.perf;
  S.aus[it.p].push({perf,age:0,re:false,cheap:it.cheap});
  goodTake(perf,sx.x+48,sx.y+30);
}
function clickRost(i){
  const w=S.rost[i]; if(!w) return; const r=slotRost(i);
  if (w.burnt){ S.rost[i]=null; burnt('wurst',1,r.x+32,r.y+30); return; }
  if (w.side===1){ if(w.t>=WURST.side){ w.side=2; w.pf=w.t<=WURST.perfFlip; w.t=0; } else float(r.x+32,r.y+20,'zu früh',C.dim); return; }
  if (w.t<WURST.side){ float(r.x+32,r.y+20,'noch nicht',C.dim); return; }
  S.rost[i]=null; const perf=w.pf && w.t<=WURST.perf;
  S.aus.wurst.push({perf,age:0}); goodTake(perf,r.x+32,r.y+20);
}
function flipAll(){ S.rost.forEach((w,i)=>{ if(w&&w.side===1&&!w.burnt&&w.t>=WURST.side) clickRost(i); }); }
function clickFry(i){
  const b=S.fry[i], r=slotFry(i);
  if(!b){ if(i<S.up.fry) loadFry(); return; }
  const c=COOK.pommes;
  if (b.t<c.done){ float(r.x+60,r.y+30,'noch nicht',C.dim); return; }
  S.fry[i]=null;
  if (b.t>=c.burn){ burnt('pommes',POMMES_BATCH,r.x+60,r.y+30); return; }
  const perf=b.t<=c.perf; for(let k=0;k<POMMES_BATCH;k++) S.aus.pommes.push({perf,age:0});
  goodTake(perf,r.x+60,r.y+20);
}
function goodTake(perf,x,y){
  if (perf){ S.fuel=clamp(S.fuel+8,0,100); S.day_.perfect++; S.streak++; float(x,y,'PERFEKT',C.phos); if(S.streak%5===0) sayM(pick(SAY_M.praise)); }
  else { S.streak=0; float(x,y,'ok',C.mayo); }
}
function burnt(p,n,x,y){ S.day_.waste[p]+=n; S.day_.why.verbrannt+=n; S.streak=0; float(x,y,'VERBRANNT',C.ketchup); S.ruf=clamp(S.ruf-0.5,0,100); sayM(pick(SAY_M.burn)); }
function wartime(){ if(S.fuel>=100 && S.wt<=0){ S.fuel=0; S.wt=WT_DUR; sayM(pick(SAY_M.wt)); } }

/* ===================== Update ===================== */
let say_m={t:0,txt:''}, say_d={t:0,txt:''}, floats=[], ticker='';
function sayM(t){ say_m={t:3.2,txt:t}; }
function say(who,t){ if(who==='d') say_d={t:3,txt:t}; else sayM(t); }
function log(t){ ticker=t; }
function float(x,y,txt,col){ if(floats.length>30) floats.shift(); floats.push({x,y,txt,col,t:1.1}); }

let maddinFlip=0, maddinDir='maddinL';
function update(dt){
  if (S.phase!=='day') return;
  const d=S.day_;
  const sp = S.wt>0 ? 1.6 : 1;
  S.time+=dt;
  if (S.wt>0) S.wt-=dt;
  // Spawn
  const hour=Math.min(7,Math.floor(S.time/(DAYLEN/8)));
  S.spawnAcc += dt * custPerDay()/DAYLEN * CURVE[hour]/CMEAN;
  while(S.spawnAcc>=1){ S.spawnAcc-=1; spawnCustomer(); }
  // Garen
  for(const it of S.spiess) if(it) it.t+=dt*sp;
  for(const w of S.rost) if(w&&!w.burnt){ w.t+=dt*sp; if(w.side===1&&w.t>=WURST.flipLate) w.burnt=true; if(w.side===2&&w.t>=WURST.burn) w.burnt=true; }
  for(const b of S.fry) if(b) b.t+=dt*sp;
  if (S.salatPrep>0){ S.salatPrep-=dt*sp; if(S.salatPrep<=0){ S.salatPrep=0; S.aus.salat.push({perf:true,age:0}); } }
  // Auslage altert
  const lf = S.up.lamp ? 1.6 : 1;
  for(const p of ['pommes','wurst']){
    for(const it of S.aus[p]) it.age+=dt;
    const lim=LASCH[p]*lf, before=S.aus[p].length;
    S.aus[p]=S.aus[p].filter(it=>it.age<lim);
    const n=before-S.aus[p].length; if(n>0){ d.waste[p]+=n; d.why.lasch+=n; float(170+P.indexOf(p)*148,400,`${n}× lasch`,C.ketchup); }
  }
  // Schlange
  for(let i=0;i<S.queue.length;i++){
    const c=S.queue[i]; const tx=qx(i); c.x += (tx-c.x)*Math.min(1,dt*6);
    if (S.wt<=0 && !c.res) c.pat-=dt;
    if (c.pat<=0){ S.queue.splice(i,1); i--; d.lost++; S.ruf=clamp(S.ruf-4,0,100); S.streak=0; sayM(pick(SAY_M.lost)); float(tx,200,'WEG!',C.ketchup); }
  }
  if (S.queue.length>=5 && say_m.t<=0 && Math.random()<dt*0.4) sayM(pick(SAY_M.queue));
  // Kloska am Tresen
  const k=S.kl;
  if (!k.job && S.jobs.length){ k.job=S.jobs.shift(); k.t=0; }
  if (k.job){
    const i=S.queue.indexOf(k.job), tx=i>=0?qx(i):k.x, dx=tx-k.x, step=900*dt*sp;
    if (Math.abs(dx)>step) k.x+=Math.sign(dx)*step;
    else { k.x=tx; k.t+=dt*sp; if(k.t>=0.3){ finishSale(k.job); k.job=null; if(Math.random()<0.12) say('d',pick(SAY_K_OK)); } }
  }
  if (S.auto){
    S.aCd-=dt;
    if (S.aCd<=0){
      S.aCd=3.2;
      const i=S.queue.findIndex(canServe);
      if (i>=0){
        if (Math.random() < 0.84+S.up.schul*0.04) reserve(S.queue[i]);
        else {
          const p=pick(P.filter(p=>S.aus[p].length>0));
          S.aus[p].shift(); d.waste[p]++; d.why.kloska++; S.ruf=clamp(S.ruf-2,0,100);
          say('d',pick(SAY_K)); float(qx(i),150,`Kloska: falsches ${NAME[p]}`,C.ketchup);
          if (Math.random()<0.5) setTimeout(()=>sayM(pick(SAY_M.kloska)),700);
        }
      }
    }
  }
  // Max & Moritz
  if (S.raids.length && S.time>=S.raids[0] && !S.raid){ S.raids.shift(); S.raid={t:5}; sayM(pick(SAY_M.raid)); log('Max und Moritz klettern auf den Wagen! Anklicken!'); }
  if (S.raid){
    S.raid.t-=dt;
    if (S.raid.t<=0){
      let stolen=0;
      for(let k=0;k<2;k++){
        if (S.aus.huhn.length){ S.aus.huhn.pop(); stolen++; continue; }
        const j=S.spiess.findIndex(it=>it&&it.p==='huhn'); if(j>=0){ S.spiess[j]=null; stolen++; }
      }
      d.waste.huhn+=stolen; d.why.gestohlen+=stolen; S.raid=null;
      float(230,120,stolen?`${stolen} Hähnchen geklaut!`:'Nichts zu holen',C.ketchup); log(stolen?`Max und Moritz haben ${stolen} Hähnchen erbeutet.`:'Max und Moritz ziehen leer ab.');
    }
  }
  // Sprech-Timer, Floats
  say_m.t-=dt; say_d.t-=dt;
  for(const f of floats){ f.t-=dt; f.y-=dt*28; } floats=floats.filter(f=>f.t>0);
  maddinFlip-=dt; if(maddinFlip<=0){ maddinFlip=rnd(2,5); maddinDir=Math.random()<0.5?'maddinL':'maddinR'; }
  if (S.ruf<=0){ endDay('ruf'); return; }
  if (S.time>=DAYLEN) endDay();
}

/* ===================== Layout ===================== */
const R = {
  spiess:{x:20,y:68,w:440,h:304}, rost:{x:476,y:68,w:284,h:184}, fry:{x:476,y:266,w:284,h:106},
  aus:{x:20,y:386,w:740,h:118}, lager:{x:20,y:518,w:740,h:134}, theke:{x:776,y:68,w:484,h:584},
};
function slotSpiess(i){ return {x:R.spiess.x+12+(i%4)*106, y:R.spiess.y+36+Math.floor(i/4)*134, w:98, h:122}; }
function slotRost(i){ return {x:R.rost.x+12+(i%4)*67, y:R.rost.y+34+Math.floor(i/4)*74, w:62, h:68}; }
function slotFry(i){ return {x:R.fry.x+12+i*136, y:R.fry.y+32, w:128, h:64}; }

/* ===================== Rendering ===================== */
const cv=document.getElementById('cv'), ctx=cv.getContext('2d');
let dpr=1;
function fit(){
  const vw=innerWidth-34, vh=innerHeight-26, s=Math.min(vw/W, vh/H);
  cv.style.width=Math.floor(W*s)+'px'; cv.style.height=Math.floor(H*s)+'px';
  dpr=Math.min(2,(window.devicePixelRatio||1)*Math.max(1,s));
  cv.width=Math.round(W*dpr); cv.height=Math.round(H*dpr);
}
addEventListener('resize',fit);
const iconCache={};
function icon(p,s){
  const k=p+s; if(iconCache[k]) return iconCache[k];
  const c=document.createElement('canvas'); c.width=c.height=Math.ceil(s*1.2*2);
  const x=c.getContext('2d'); x.scale(2,2); x.textAlign='center'; x.textBaseline='middle';
  x.font=`${s}px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif`; x.fillText(EMO[p],s*0.6,s*0.65);
  return iconCache[k]=c;
}
function drawIcon(p,cx,cy,s,dark){
  const c=icon(p,s), w=s*1.2;
  ctx.drawImage(c,cx-w/2,cy-w/2,w,w);
  if (dark>0){ ctx.globalAlpha=dark; ctx.fillStyle='#1a0d05'; ctx.beginPath(); ctx.arc(cx,cy,s*0.42,0,7); ctx.fill(); ctx.globalAlpha=1; }
}
function txt(t,x,y,size,col,align='left',font=F.body,weight=600){ ctx.font=`${weight} ${size}px ${font}`; ctx.fillStyle=col; ctx.textAlign=align; ctx.textBaseline='alphabetic'; ctx.fillText(t,x,y); }
function panel(r,title,key){
  ctx.fillStyle=C.panel; ctx.fillRect(r.x,r.y,r.w,r.h);
  ctx.strokeStyle=C.line; ctx.lineWidth=1; ctx.strokeRect(r.x+.5,r.y+.5,r.w-1,r.h-1);
  txt(title,r.x+12,r.y+22,13,C.phos,'left',F.disp,700);
  if (key) txt(key,r.x+r.w-12,r.y+22,12,C.dim,'right',F.disp,400);
}
function cookBar(x,y,w,t,done,perf,burn){
  const tot=burn*1.15, sx=v=>x+w*Math.min(1,v/tot);
  ctx.fillStyle='#3a4647'; ctx.fillRect(x,y,sx(done)-x,6);
  ctx.fillStyle=C.phos; ctx.fillRect(sx(done),y,sx(perf)-sx(done),6);
  ctx.fillStyle=C.grill; ctx.fillRect(sx(perf),y,sx(burn)-sx(perf),6);
  ctx.fillStyle=C.ketchup; ctx.fillRect(sx(burn),y,x+w-sx(burn),6);
  const mx=sx(t); ctx.fillStyle=C.fg; ctx.fillRect(mx-1,y-3,3,12);
}
function bubble(x,y,w,h,text,tail){ // tail: 'down'|'left'|'right'
  ctx.fillStyle=C.paper; ctx.fillRect(x,y,w,h);
  ctx.beginPath();
  if(tail==='down'){ ctx.moveTo(x+w-40,y+h); ctx.lineTo(x+w-28,y+h+12); ctx.lineTo(x+w-20,y+h); }
  if(tail==='left'){ ctx.moveTo(x,y+h-22); ctx.lineTo(x-12,y+h-10); ctx.lineTo(x,y+h-10); }
  if(tail==='right'){ ctx.moveTo(x+w,y+h-22); ctx.lineTo(x+w+12,y+h-10); ctx.lineTo(x+w,y+h-10); }
  ctx.fill();
  ctx.font=`600 15px ${F.body}`; ctx.fillStyle=C.ink; ctx.textAlign='left';
  wrap(text,x+10,y+21,w-20,18);
}
function wrap(t,x,y,maxW,lh){ const words=t.split(' '); let line=''; for(const w of words){ const tst=line?line+' '+w:w; if(ctx.measureText(tst).width>maxW&&line){ ctx.fillText(line,x,y); line=w; y+=lh; } else line=tst; } ctx.fillText(line,x,y); }

let hover=-1;

    else txt(w.side===1?'Seite 1':'Seite 2',r.x+r.w/2,r.y+54,10,C.dim,'center');

  // FRITTEUSE
  panel(R.fry,'FRITTEUSE','KORB ANKLICKEN');
  for(let i=0;i<2;i++){
    const r=slotFry(i), locked=i>=S.up.fry;
    ctx.fillStyle=locked?'#182021':'#2a2416'; ctx.fillRect(r.x,r.y,r.w,r.h);
    ctx.strokeStyle=locked?'#26302f':C.line; ctx.strokeRect(r.x+.5,r.y+.5,r.w-1,r.h-1);

    const b=S.fry[i];

    const c=COOK.pommes;
    drawIcon('pommes',r.x+34,r.y+30,34, b.t>=c.burn?0.85:0);
    const lab = b.t>=c.burn?'VERBRANNT':b.t>=c.done?(b.t<=c.perf?'RAUS!':'raus'):Math.ceil(c.done-b.t)+' s';
    txt(lab,r.x+86,r.y+36,13,b.t>=c.burn?C.ketchup:b.t>=c.done?(b.t<=c.perf?C.phos:C.grill):C.dim,'center',F.disp,700);

  // AUSLAGE

  P.forEach((p,i)=>{

    ctx.fillStyle=h?'#33484a':C.panel2; ctx.fillRect(b.x,b.y,b.w,b.h); ctx.strokeStyle=h?C.grill:C.line; ctx.strokeRect(b.x+.5,b.y+.5,b.w-1,b.h-1);

  // THEKE

  if (IMG.kaffee.complete) { ctx.globalAlpha=0.5; ctx.drawImage(IMG.kaffee,R.theke.x+16,R.theke.y+R.theke.h-122,133,110); ctx.globalAlpha=1; }
  S.queue.forEach((c,i)=>{
    const x=c.x, ok=canServe(c), f=c.pat/c.max;

    if (c.res) txt('KOMMT',x,104+bh+14,10,C.phos,'center',F.disp,700);
    const img=IMG[c.spr]; const bob=Math.sin(performance.now()/300+c.bob)*2;
    if (img.complete) ctx.drawImage(img,x-34,204+bob-(f<0.3&&!c.res?Math.random()*2:0),68,71);
    ctx.fillStyle='#0c1213'; ctx.fillRect(x-30,280,60,5); ctx.fillStyle=c.res?C.phos:f<0.3?C.ketchup:f<0.6?C.grill:C.phos; ctx.fillRect(x-30,280,60*f,5);
    if (hover===200+i){ ctx.strokeStyle=C.mayo; ctx.strokeRect(x-36.5,96.5,73,190); }

  if (!S.queue.length) txt('Keine Kundschaft. Noch.',R.theke.x+R.theke.w/2,200,14,C.dim,'center');

  if (S.auto) txt('AUTOPILOT',k.x,497,9,C.grill,'center',F.disp,700);
  if (say_d.t>0){ const left=k.x>1040; bubble(left?k.x-250:k.x+30,330,220,62,say_d.txt,left?'right':'left'); }
  // Maddin
  const mi=IMG[maddinDir];
  if (mi.complete) ctx.drawImage(mi,R.theke.x+R.theke.w-90,R.theke.y+R.theke.h-178,68,170);
  txt('MADDIN',R.theke.x+R.theke.w-56,R.theke.y+R.theke.h-182,10,C.dim,'center',F.disp);
  if (say_m.t>0) bubble(R.theke.x+150,R.theke.y+R.theke.h-122,240,70,say_m.txt,'right');
  if (S.wt>0){ ctx.fillStyle=`rgba(217,71,47,${0.06+0.04*Math.sin(performance.now()/90)})`; ctx.fillRect(0,55,W,H-55); }

  // Ticker
  ctx.fillStyle=C.panel; ctx.fillRect(0,664,W,56); ctx.fillStyle=C.line; ctx.fillRect(0,664,W,1);

}
function btn(b,label,on,small){
  ctx.fillStyle=on?'#3a4f50':C.panel2; ctx.fillRect(b.x,b.y,b.w,b.h);
  ctx.strokeStyle=on?C.grill:C.line; ctx.strokeRect(b.x+.5,b.y+.5,b.w-1,b.h-1);
  txt(label,b.x+b.w/2,b.y+b.h/2+(small?4:5),small?11:13,on?C.grill:C.mayo,'center',F.disp,700);
}
function spiessHalf(i,h){ const r=slotSpiess(i); return {x:r.x+6,y:r.y+8+h*56,w:r.w-12,h:50}; }
function drawKid(x,y,col){
  ctx.fillStyle='#f0c9a0'; ctx.beginPath(); ctx.arc(x,y-20,6,0,7); ctx.fill();
  ctx.fillStyle='#3b2a1a'; ctx.fillRect(x-6,y-27,12,4);
  ctx.fillStyle=col; ctx.fillRect(x-5,y-14,10,10); ctx.fillStyle='#222'; ctx.fillRect(x-5,y-4,4,6); ctx.fillRect(x+1,y-4,4,6);
}

/* ===================== Input ===================== */
function toLocal(e){ const b=cv.getBoundingClientRect(); return {x:(e.clientX-b.left)/b.width*W, y:(e.clientY-b.top)/b.height*H}; }
const inR=(p,r)=>p.x>=r.x&&p.x<=r.x+r.w&&p.y>=r.y&&p.y<=r.y+r.h;
function hitTest(p){
  if (inR(p,BTN.pause)) return ['pause'];
  if (inR(p,BTN.wt)) return ['wt'];
  if (inR(p,BTN.flip)) return ['flip'];
  if (S.raid && inR(p,{x:R.spiess.x+R.spiess.w-130,y:R.spiess.y,w:130,h:34})) return ['raid'];
  for(let i=0;i<S.up.spiess;i++) if(inR(p,slotSpiess(i))){ if(!S.spiess[i]) return ['spLoad',i, p.y<slotSpiess(i).y+61?0:1]; return ['spiess',i]; }
  for(let i=0;i<S.up.rost;i++) if(inR(p,slotRost(i))) return [S.rost[i]?'rost':'rostLoad',i];
  for(let i=0;i<S.up.fry;i++) if(inR(p,slotFry(i))) return ['fry',i];
  for(let i=0;i<5;i++) if(inR(p,lagerBtn(i))) return ['lager',i];
  for(let i=0;i<S.queue.length;i++) if(inR(p,custRect(i))) return ['cust',i];
  return null;
}
function hoverCode(h){
  if(!h) return -1;
  switch(h[0]){ case 'lager': return 100+h[1]; case 'cust': return 200+h[1]; case 'spLoad': return 300+h[1]*2+h[2]; case 'rostLoad': return 400+h[1]; case 'pause': return 2; case 'flip': return 3; default: return 1; }
}
cv.addEventListener('mousemove',e=>{ if(!S||S.phase!=='day') return; const h=hitTest(toLocal(e)); hover=hoverCode(h); cv.style.cursor=h?'pointer':'default'; });
cv.addEventListener('mouseleave',()=>{ hover=-1; });
cv.addEventListener('mousedown',e=>{
  if(!S||S.phase!=='day'||paused||e.button!==0) return; e.preventDefault();
  const h=hitTest(toLocal(e)); if(!h) return;
  const [k,i,half]=h;
  if(k==='pause') togglePause(true);
  else if(k==='spLoad') loadSpiess(half?'haxe':'huhn',i);
  else if(k==='spiess') takeSpiess(i);
  else if(k==='rostLoad') loadRost(i);
  else if(k==='rost') clickRost(i);
  else if(k==='flip') flipAll();
  else if(k==='fry') clickFry(i);
  else if(k==='lager') [()=>loadSpiess('huhn'),()=>loadSpiess('haxe'),()=>loadRost(),loadFry,prepSalat][i]();
  else if(k==='cust'){ const c=S.queue[i]; if(c.res) float(qx(i),190,'Kloska kommt',C.dim); else if(!serve(i)) float(qx(i),190,'fehlt noch was',C.dim); }
  else if(k==='raid'){ S.raid=null; S.fuel=clamp(S.fuel+15,0,100); sayM(pick(SAY_M.raid)); float(R.spiess.x+R.spiess.w-60,90,'VERJAGT!',C.phos); log('Max und Moritz verjagt.'); }
  else if(k==='wt'){ if(S.fuel>=100) wartime(); else float(850,80,'Wartime lädt durch perfekte Ware',C.dim); }
});
cv.addEventListener('contextmenu',e=>e.preventDefault());
// Optionale Tastenkürzel, nicht nötig
addEventListener('keydown',e=>{
  if(!S||S.phase!=='day') return;
  if (e.code==='KeyP'||e.code==='Escape'){ togglePause(); return; }
  if (paused) return;
  const k=e.key.toLowerCase();
  if(k==='1') loadSpiess('huhn'); else if(k==='2') loadSpiess('haxe'); else if(k==='3') loadRost(); else if(k==='4') loadFry(); else if(k==='5') prepSalat();
  else if(k==='f') flipAll(); else if(k==='m') wartime();
  else if(e.code==='Space'){ e.preventDefault(); const i=S.queue.findIndex(canServe); if(i>=0) serve(i); }
});

/* ===================== Loop ===================== */
let paused=false, last=performance.now(), acc=0; const STEP=1/60;
function frame(now){
  let dt=(now-last)/1000; last=now; if(dt>0.25) dt=0.25;
  if (!paused && S && S.phase==='day'){ acc+=dt; while(acc>=STEP){ update(STEP); acc-=STEP; } } else acc=0;
  render();
  requestAnimationFrame(frame);
}
function togglePause(force){
  paused = force ?? !paused;
  const o=$('ovPause');
  if (paused){ o.innerHTML=`<div class="card" style="max-width:420px"><div class="stack"><h2>PAUSE</h2><p class="dim">Der Spieß dreht sich nicht weiter. Maddin wartet.</p><div class="row"><button class="btn go" id="bResume">Weiter</button></div></div></div>`; o.hidden=false; $('bResume').onclick=()=>togglePause(false); $('bResume').focus(); }
  else o.hidden=true;
}
addEventListener('blur',()=>{ if(S&&S.phase==='day') togglePause(true); });

/* ===================== Overlays ===================== */
const $=id=>document.getElementById(id);
function hideAll(){ for(const id of ['ovTitle','ovBon','ovEve','ovOver','ovPause']) $(id).hidden=true; }
function show(id,html){ hideAll(); const o=$(id); o.innerHTML=html; o.hidden=false; o.scrollTop=0; }

      <div class="row">

    </div></div></div>`);
  if (run) $('bCont').onclick=()=>{ S=run; if(S.auto===undefined) S.auto=false; S.kl=S.kl||{x:1010,job:null,t:0}; S.jobs=S.jobs||[]; showEvening(); };
  $('bNew').onclick=newRun;

}

    ${why}
    ${d.kontrolle?'<hr><div class="c"><b>KONTROLLE!</b> Aufgewärmte Ware gefunden. Ruf −15.</div>':''}
    <hr><div class="c">Vielen Dank für Ihren Einkauf.<br>Maddin sieht alles.</div>
   </div>
   <button class="btn go" id="bBon">${S.over?'Abrechnung lesen':'Weiter zu Peter'}</button></div>`);
  $('bBon').onclick=()=>S.over?showOver():showEvening();
  $('bBon').focus();

function buyPrice(p){ return BUY[p]*Math.pow(1.012,S.day-1)*(p==='huhn'&&S.cheapNext?0.65:1); }
function upPrice(k){ const u=UPG[k]; return Math.round(u.base*Math.pow(1.5,S.upBought[k])); }
function upMaxed(k){ const u=UPG[k]; return k==='kuehl'? S.up.kuehl>=u.max : S.up[k]>=u.max; }

function showEvening(){
  S.phase='evening';
  if (!S.order) S.order=blank();
  const last7=S.hist.slice(-7);
  const avg=p=>last7.length?last7.reduce((a,h)=>a+h.sold[p],0)/last7.length:0;
  const peterSays = pick(['Na, Junge. Was brauchst du für morgen?','Frische Ware, ehrliche Preise. Meistens.','Ich hab noch Sonderposten Hühner. Frag nicht, woher.','Bestell lieber zu viel als zu wenig. Sagt Maddin. Ich sag nichts.']);
  const html=()=>{
    const tot=P.reduce((a,p)=>a+S.order[p]*buyPrice(p),0);
    const space=S.up.kuehl-stockTotal(), ordered=P.reduce((a,p)=>a+S.order[p],0);
    return `<div class="card"><div class="grid2">
    <div class="stack">
      <h2>FEIERABEND · TAG ${S.day-1} VORBEI</h2>
      <div class="peter"><img src="${IMG_SRC.peter}" alt="Peter vom Großmarkt"><div class="speech"><b>Peter vom Großmarkt:</b> ${peterSays}</div></div>
      <div><h3>Prognose für Tag ${S.day}</h3><p class="fc">${S.forecast.name}</p><p class="dim" style="font-size:13px">Quelle: Darius' Wetter-App. Trefferquote etwa 80 %.${fcHint()}</p></div>
      <h3>Bestellung (Lieferung morgen früh)</h3>
      <div class="tbl"><table>
        <thead><tr><th>Ware</th><th>Letzte 7 Tage</th><th>Ø/Tag</th><th>Lager</th><th>Bestellen</th><th>Preis</th></tr></thead>
        <tbody>${P.map(p=>`<tr>
          <td>${EMO[p]} ${NAME[p]}</td>
          <td><div class="spark" title="Verkauft pro Tag">${sparkBars(p,last7)}</div></td>
          <td>${avg(p).toFixed(1)}</td>
          <td>${stockCount(p)}${S.stock[p].some(b=>b.age>=SPOIL[p]-1)?' <span style="color:var(--ketchup)">!</span>':''}</td>
          <td><div class="row" style="gap:4px;flex-wrap:nowrap;justify-content:flex-end"><button class="btn sm" data-q="${p}" data-d="-5">−5</button><button class="btn sm" data-q="${p}" data-d="-1">−</button><input class="qty" id="q_${p}" data-p="${p}" inputmode="numeric" value="${S.order[p]}"><button class="btn sm" data-q="${p}" data-d="1">+</button><button class="btn sm" data-q="${p}" data-d="5">+5</button></div></td>
          <td>${eur(buyPrice(p))}</td></tr>`).join('')}</tbody></table></div>
      <label class="tog"><input type="checkbox" id="cbCheap" ${S.cheapNext?'checked':''}><span><b>Peters Sonderposten-Hühner</b> (−35 %). Manche Kunden merken es. Ruf leidet.</span></label>
      <div><div class="row" style="justify-content:space-between"><span class="dim">Kühlung nach Lieferung</span><span>${stockTotal()+ordered} / ${S.up.kuehl}</span></div>
        <div class="bar ${ordered>space?'warn':''}"><i style="width:${Math.min(100,(stockTotal()+ordered)/S.up.kuehl*100)}%"></i></div>
        <p class="dim" style="font-size:12.5px;margin-top:4px">Haltbarkeit roh: Salat 2 Tage, Hühner und Haxen 4, Würste 5, Pommes 7.</p></div>
      <div class="row" style="justify-content:space-between"><span>Bestellung: <b>${eur(tot)}</b> · Kasse danach: <b style="color:${S.cash-tot<0?'var(--ketchup)':'var(--phos)'}">${eur(S.cash-tot)}</b></span>
        <button class="btn go" id="bStart" ${S.cash-tot<0||ordered>space?'disabled':''}>Tag ${S.day} starten</button></div>
      ${ordered>space?'<p style="color:var(--ketchup);font-size:13px">Zu viel für die Kühlung. Weniger bestellen oder Kühlzelle kaufen.</p>':''}
      ${S.cash-tot<0?'<p style="color:var(--ketchup);font-size:13px">Peter liefert nicht auf Pump.</p>':''}
    </div>
    <div class="stack">
      <h3>Wagen aufrüsten</h3>
      <div>${Object.keys(UPG).map(k=>{ const u=UPG[k], mx=upMaxed(k), pr=upPrice(k); const lvl=k==='kuehl'?`${S.up.kuehl} Einh.`:k==='schul'?`Stufe ${S.up.schul}`:k==='spiess'||k==='rost'?`${S.up[k]} Plätze`:k==='fry'?`${S.up.fry} Korb`:`Stufe ${S.up[k]}`;
          return `<div class="up"><div><b>${u.name}</b> <span class="dim" style="font-size:12.5px">· ${lvl}</span><small>${u.desc}</small></div><button class="btn sm" data-up="${k}" ${mx||S.cash<pr||(k==='schul'&&!S.auto)?'disabled':''}>${mx?'max':eur(pr)}</button></div>`; }).join('')}</div>
      <h3>Personal & Risiko</h3>
      <div class="peter" style="align-items:center"><img src="${IMG_SRC.kloska}" alt="Kloska" style="height:90px">
        <label class="tog"><input type="checkbox" id="cbAuto" ${S.auto?'checked':''}><span><b>Kloska Autopilot</b> (60 € Überstunden pro Tag). Kloska verkauft selbstständig, sobald eine Bestellung komplett ist. Verwechselt dabei aktuell ${Math.round((0.16-S.up.schul*0.04)*100)} %. Ohne Autopilot verkauft er nur auf deinen Klick, dafür fehlerfrei.</span></label></div>
      <label class="tog"><input type="checkbox" id="cbReheat" ${S.reheat?'checked':''}><span><b>Reste-Hähnchen aufwärmen</b>: Übrige Hähnchen und Haxen gehen morgen wieder in die Auslage statt in den Müll. Je mehr davon verkauft werden, desto wahrscheinlicher kommt die Kontrolle.</span></label>
      <h3>Verlauf</h3>
      <div class="tbl"><table><thead><tr><th>Tag</th><th>Umsatz</th>${P.map(p=>`<th>${EMO[p]}</th>`).join('')}<th>Verlust</th></tr></thead>
      <tbody>${S.hist.slice(-7).reverse().map(h=>`<tr><td>${h.n}</td><td>${eur(h.revenue)}</td>${P.map(p=>`<td>${h.sold[p]}</td>`).join('')}<td>${P.reduce((a,p)=>a+h.waste[p],0)}</td></tr>`).join('')||'<tr><td colspan="8" class="dim">Noch keine Tage.</td></tr>'}</tbody></table></div>
      <p class="dim" style="font-size:13px">Dieser Run: ${S.run.served} bedient · ${P.map(p=>`${S.run.sold[p]} ${NAME[p]}`).join(' · ')}</p>
    </div></div></div>`;
  };
  const draw=()=>{
    const focus=document.activeElement&&document.activeElement.id;
    show('ovEve',html());
    $('ovEve').querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{ const p=b.dataset.q; S.order[p]=Math.max(0,S.order[p]+(+b.dataset.d)); draw(); });
    $('ovEve').querySelectorAll('.qty').forEach(inp=>inp.onchange=()=>{ const v=parseInt(inp.value,10); S.order[inp.dataset.p]=Number.isFinite(v)&&v>0?v:0; draw(); });
    $('ovEve').querySelectorAll('[data-up]').forEach(b=>b.onclick=()=>buyUp(b.dataset.up,draw));
    $('cbCheap').onchange=e=>{ S.cheapNext=e.target.checked; draw(); };
    $('cbAuto').onchange=e=>{ S.auto=e.target.checked; draw(); };
    $('cbReheat').onchange=e=>{ S.reheat=e.target.checked; };
    $('bStart').onclick=()=>{ const tot=P.reduce((a,p)=>a+S.order[p]*buyPrice(p),0); S.cash-=tot; STORE.run=null; saveStore(); startDay(false); };
    if (focus&&$(focus)) $(focus).focus();
  };
  draw();
}
function fcHint(){ const m=S.forecast.mult, parts=Object.entries(m).map(([p,v])=>`${NAME[p]} ${v>1?'↑':'↓'}`); const cu=S.forecast.cust; return (cu!==1?` Kundschaft ${cu>1?'↑':'↓'}.`:'')+(parts.length?' '+parts.join(', ')+'.':''); }
function sparkBars(p,h){ const mx=Math.max(1,...h.map(d=>d.sold[p])); return h.map(d=>`<i style="height:${Math.max(4,d.sold[p]/mx*100)}%"></i>`).join('')||'<span class="dim">–</span>'; }
function buyUp(k,redraw){
  const pr=upPrice(k); if(S.cash<pr||upMaxed(k)) return;
  S.cash-=pr; S.upBought[k]++; S.up[k]+=UPG[k].step; redraw();
}

function showOver(){
  recordBestSafe();
  const L=STORE.life, r=S.run;
  const reason = S.over==='ruf' ? 'Dein Ruf ist bei null. Niemand kauft mehr bei LS-Chicken.' : 'Die Kasse ist im Minus. Peter liefert nicht mehr, der Wagen wird abgeschleppt.';
  show('ovOver',`<div class="card" style="max-width:760px"><div class="stack">
    <div class="peter"><img src="${IMG_SRC.maddinR}" alt="Maddin" style="height:150px"><div class="speech"><b>Maddin:</b> ${S.over==='ruf'?'Den Ruf kriegst du nicht mit Rabatt zurück.':'Pleite. In meiner Schicht. Unfassbar.'}</div></div>
    <h2>AUS NACH ${S.day-1} ${S.day-1===1?'TAG':'TAGEN'}</h2>
    <p>${reason}</p>
    <div class="tbl"><table><thead><tr><th></th>${P.map(p=>`<th>${EMO[p]} ${NAME[p]}</th>`).join('')}</tr></thead><tbody>
      <tr><td>Verkauft (Run)</td>${P.map(p=>`<td>${r.sold[p]}</td>`).join('')}</tr>
      <tr><td>Verlust (Run)</td>${P.map(p=>`<td>${r.waste[p]}</td>`).join('')}</tr>
      <tr><td>Verkauft (gesamt)</td>${P.map(p=>`<td>${L.sold[p]}</td>`).join('')}</tr>
      <tr><td>Verlust (gesamt)</td>${P.map(p=>`<td>${L.waste[p]}</td>`).join('')}</tr>
    </tbody></table></div>
    <p class="dim">Run: ${eur(r.revenue)} Umsatz · ${r.served} bedient · ${r.lost} verloren · ${r.stolen} Hähnchen an Max & Moritz.</p>
    <h3>Bestenliste (dieser Browser)</h3>
    <div class="tbl"><table><thead><tr><th>#</th><th>Tage</th><th>Umsatz</th><th>Datum</th></tr></thead><tbody>
    ${STORE.best.map((b,i)=>`<tr><td>${i+1}</td><td>${b.days}</td><td>${eur(b.revenue)}</td><td>${b.date}</td></tr>`).join('')}</tbody></table></div>
    <div class="row"><button class="btn go" id="bAgain">Neuer Run</button><button class="btn" id="bMenu">Titel</button>${IN_TS?'<button class="btn" id="bBack2">Zurück zu Ticket Slayer</button>':''}</div>
  </div></div>`);
  $('bAgain').onclick=newRun; $('bMenu').onclick=showTitle; if(IN_TS) $('bBack2').onclick=backToTS;
}
function recordBestSafe(){ /* bereits in endDay erfasst */ }

/* ===================== Hot reload & Start ===================== */
window.claude?.hot?.snapshot?.(()=>({S, phase:S&&S.phase}));
function boot(data){
  fit();
  if (data && data.S){ S=data.S; if(S.phase==='day'){ hideAll(); togglePause(true); } else if(S.phase==='evening') showEvening(); else showTitle(); }
  else if (!tsAccess()) showGate();
  else showTitle();
  requestAnimationFrame(frame);
}
const startFn = ()=>{ (document.fonts?document.fonts.ready:Promise.resolve()).then(()=>boot(window.claude?.hot?.data)); };
window.claude?.hot?.ready ? window.claude.hot.ready(d=>{ (document.fonts?document.fonts.ready:Promise.resolve()).then(()=>boot(d)); }) : startFn();
</script>
