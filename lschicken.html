<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>LS-Chicken</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=Chakra+Petch:wght@400;600;700&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
<style>
/* Leitstand-Monitor um einen Hähnchenwagen: Spielfeld als ein Canvas, Abend/Kassenbon/Peter als DOM-Overlays */
:root{
  --bg:#121a1b; --panel:#1d2829; --panel2:#253334; --line:#36494a;
  --fg:#e9e3cf; --dim:#8ea19e; --grill:#f0a03a; --ketchup:#d9472f; --phos:#7fd6a6; --mayo:#f4ebc9; --paper:#f6f1e1; --ink:#2a2622;
  --f-disp:'Silkscreen',ui-monospace,monospace;
  --f-body:'Chakra Petch',system-ui,sans-serif;
  --f-bon:'Courier Prime','Courier New',monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;margin:0;overflow:hidden}
#wrap{position:fixed;inset:0;display:grid;place-items:center;padding:12px 16px}
#cv{display:block;border:1px solid var(--line);background:var(--bg);cursor:pointer;max-width:100%}
.ov{position:fixed;inset:0;background:rgba(9,13,14,.9);display:flex;justify-content:center;align-items:flex-start;overflow:auto;padding:28px 16px;z-index:5}
.ov[hidden]{display:none!important}
.card{background:var(--panel);border:1px solid var(--line);padding:22px;max-width:1080px;width:100%;min-width:0}
h1,h2,h3{font-family:var(--f-disp);font-weight:700;letter-spacing:.04em;margin:0;text-wrap:balance}
h1{font-size:44px;color:var(--grill)}
h2{font-size:22px;color:var(--grill)}
h3{font-size:14px;color:var(--phos);letter-spacing:.08em;text-transform:uppercase}
p{margin:0;line-height:1.5}
.dim{color:var(--dim)}
.btn{font:600 15px var(--f-body);background:var(--panel2);color:var(--fg);border:1px solid var(--line);padding:9px 16px;cursor:pointer}
.btn:hover{border-color:var(--grill)}
.btn:focus-visible{outline:2px solid var(--phos);outline-offset:2px}
.btn.go{background:var(--grill);color:var(--ink);border-color:var(--grill);font-family:var(--f-disp);font-size:16px}
.btn.go:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.sm{padding:3px 9px;font-size:13px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.stack{display:flex;flex-direction:column;gap:14px;min-width:0}
.grid2{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:22px}
@media (max-width:820px){.grid2{grid-template-columns:1fr}}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:6px 6px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-weight:600;color:var(--dim);font-size:12px;letter-spacing:.06em;text-transform:uppercase}
td:first-child,th:first-child{text-align:left}
.tbl{overflow-x:auto}
.qty{width:52px;font:600 15px var(--f-body);background:var(--bg);color:var(--fg);border:1px solid var(--line);text-align:center;padding:4px}
.bar{height:8px;background:var(--bg);border:1px solid var(--line)}
.bar>i{display:block;height:100%;background:var(--phos)}
.bar.warn>i{background:var(--ketchup)}
.peter{display:flex;gap:14px;align-items:flex-end}
.peter img{height:120px;flex:none}
.speech{background:var(--paper);color:var(--ink);padding:10px 12px;font-size:14px;line-height:1.4;position:relative;flex:1;min-width:0}
.fc{font-family:var(--f-disp);font-size:18px;color:var(--mayo)}
.up{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.up small{color:var(--dim);display:block;font-size:12.5px}
.chip{display:inline-block;border:1px solid;padding:0 7px;font-size:12px;font-weight:600;white-space:nowrap}
.night{border:1px solid #3b4f8a;background:#141c33;padding:12px 14px}
.night h3{color:#9fb6ff}
.tog{display:flex;gap:10px;align-items:flex-start;cursor:pointer;font-size:14px;line-height:1.35}
.tog input{margin-top:3px;accent-color:var(--grill)}
.spark{display:flex;gap:2px;align-items:flex-end;height:22px}
.spark i{display:block;width:6px;background:var(--phos);min-height:1px}
/* Kassenbon */
.bon{background:var(--paper);color:var(--ink);font-family:var(--f-bon);max-width:420px;width:100%;padding:26px 24px 30px;font-size:14px;line-height:1.45;box-shadow:0 12px 40px rgba(0,0,0,.5);
  -webkit-mask:linear-gradient(135deg,#0000 6px,#000 0) bottom left/12px 12px repeat-x,linear-gradient(#000 0 0) top/100% calc(100% - 10px) no-repeat;
          mask:conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) bottom/14px 10px repeat-x,linear-gradient(#000 0 0) top/100% calc(100% - 10px) no-repeat}
.bon .c{text-align:center}
.bon .l{display:flex;justify-content:space-between;gap:10px;font-variant-numeric:tabular-nums}
.bon hr{border:0;border-top:1px dashed var(--ink);margin:8px 0}
.bon .big{font-size:20px;font-weight:700}
.bon .neg{color:#9b2b1b}
.bonrow{display:flex;gap:22px;flex-wrap:wrap;justify-content:center;align-items:flex-start;width:100%}
.rev{background:var(--paper);color:var(--ink);max-width:440px;width:100%;padding:18px 20px;box-shadow:0 12px 40px rgba(0,0,0,.5);font-size:14px;line-height:1.45}
.rev h4{margin:0;font:700 17px var(--f-body)}
.rev .sum{display:flex;align-items:center;gap:10px;margin:4px 0 10px;color:#5f574e;font-size:13px}
.rev .big{font:700 30px var(--f-body);color:var(--ink)}
.stars{color:#e3a008;letter-spacing:1px;font-size:15px;white-space:nowrap}
.stars i{color:#cfc6b3;font-style:normal}
.rv{border-top:1px solid #e2d9c4;padding:10px 0 4px}
.rv .who{display:flex;gap:10px;align-items:center}
.rv .av{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;flex:none}
.rv .meta{font-size:12px;color:#7a7064}
.rv p{margin:6px 0 0}
.title{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:28px;align-items:center}
@media (max-width:820px){.title{grid-template-columns:1fr}}
.cartbox{position:relative;max-width:560px;width:100%}
.cartbox img{width:100%;display:block}
.cartbox b{position:absolute;left:31%;top:3.6%;width:42%;text-align:center;font-family:var(--f-disp);color:var(--mayo);text-shadow:2px 2px 0 rgba(0,0,0,.7);font-size:clamp(14px,3.4vw,30px);line-height:1.05}
.keys{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;font-size:14px}
kbd{font-family:var(--f-disp);font-size:12px;background:var(--bg);border:1px solid var(--line);padding:1px 6px;color:var(--mayo)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

async function fbLoadMine(){
  CLOUD_BEST=null; const ref=profRef(); if(!ref) return;
  try{ const d=await ref.get(); const l=d.exists?d.data().lsc:null; CLOUD_BEST={days:(l&&l.bestDays)||0, rev:(l&&l.bestRevenue)||0}; }catch(e){ console.warn('LSC load:',e); }
}
function fbRunStart(){ const ref=profRef(); if(!ref) return; ref.set({lsc:{name:PLAYER, runs:inc(1), lastSeen:new Date().toISOString()}},{merge:true}).catch(e=>console.warn('LSC run:',e)); }
function fbDay(d){
  const ref=profRef(); if(!ref) return;
  const lsc={name:PLAYER, days:inc(1), revenue:inc(Math.round(d.revenue*100)/100), served:inc(d.served), lastSeen:new Date().toISOString()};
  const sold={}, waste={}; P.forEach(p=>{ if(d.sold[p]>0) sold[p]=inc(d.sold[p]); if(d.waste[p]>0) waste[p]=inc(d.waste[p]); });
  if (Object.keys(sold).length) lsc.sold=sold;
  if (Object.keys(waste).length) lsc.waste=waste;
  const runRev=Math.round(S.run.revenue);
  if (CLOUD_BEST && (d.n>CLOUD_BEST.days || (d.n===CLOUD_BEST.days && runRev>CLOUD_BEST.rev))){
    Object.assign(lsc,{bestDays:d.n, bestRevenue:runRev, bestDate:new Date().toISOString(), bestSold:{...S.run.sold}});
    CLOUD_BEST={days:d.n, rev:runRev};
  }
  ref.set({lsc},{merge:true}).catch(e=>console.warn('LSC save:',e));
}
async function fbBoard(){
  if(!fdb) return null;
  const snap=await fdb.collection('playerProfiles').orderBy('lsc.bestDays','desc').limit(25).get();
  const rows=[]; snap.forEach(doc=>{ const l=doc.data().lsc; if(l&&l.bestDays>0) rows.push({name:doc.id, days:l.bestDays, rev:l.bestRevenue||0, huhn:(l.sold&&l.sold.huhn)||0, runs:l.runs||0}); });
  rows.sort((a,b)=>b.days-a.days||b.rev-a.rev); return rows.slice(0,10);
}
function renderBoard(el){
  if(!el) return;
  if(!fdb){ el.innerHTML='<p class="dim" style="font-size:13px">Rangliste offline. Sie läuft nur über Ticket Slayer (oder Adblocker blockiert Firebase).</p>'; return; }
  el.innerHTML='<p class="dim" style="font-size:13px">Lade Rangliste…</p>';
  fbBoard().then(rows=>{
    if(!rows||!rows.length){ el.innerHTML='<p class="dim" style="font-size:13px">Noch keine Einträge. Überlebe einen Tag und du stehst drin.</p>'; return; }
    el.innerHTML=`<div class="tbl"><table><thead><tr><th>#</th><th>Name</th><th>Tage</th><th>Umsatz</th><th>🍗 gesamt</th></tr></thead><tbody>${rows.map((x,i)=>`<tr${x.name===PLAYER?' style="color:var(--grill)"':''}><td>${['🥇','🥈','🥉'][i]||i+1}</td><td>${esc(x.name)}</td><td>${x.days}</td><td>${eur(x.rev)}</td><td>${x.huhn}</td></tr>`).join('')}</tbody></table></div>`;
  }).catch(e=>{ el.innerHTML=`<p style="color:var(--ketchup);font-size:13px">Rangliste nicht ladbar: ${esc(e.message||e)}</p>`; });
}

/* ===================== Lager ===================== */
const stockCount = p => S.stock[p].reduce((a,b)=>a+b.q,0);
const stockTotal = () => P.reduce((a,p)=>a+stockCount(p),0);
function takeStock(p,n){
  if (stockCount(p) < n) return null;
  let cheap=false;
  while(n>0){ const b=S.stock[p][0]; const t=Math.min(b.q,n); b.q-=t; n-=t; if(b.cheap) cheap=true; if(b.q<=0) S.stock[p].shift(); }
  return {cheap};
}

/* ===================== Tagesablauf ===================== */
function startDay(first){
  S.phase='day'; S.time=0; S.queue=[]; S.spawnAcc=0; S.raid=null;
  S.day_ = newDayStats();
  if (S.order){ for(const p of P){ if(S.order[p]>0) S.stock[p].push({q:S.order[p],age:0,cheap:p==='huhn'&&S.cheapNext}); } }
  S.order=null;
  if (isNightDay(S.day)){
    S.event = NIGHT;
    if (!S.night || S.night.day!==S.day) S.night = makeContract(S.day);
    S.night.next = 0;
  } else { S.night=null; S.event = Math.random()<0.8 && S.forecast.id!=='nacht' ? S.forecast : pick(EVENTS.filter(e=>!e.minDay||e.minDay<=S.day)); }
  // Max & Moritz
  S.raids=[];
  if (!isNight() && S.day>=3 && Math.random()< Math.min(0.85,0.45+S.day*0.03)){ const n = S.day>=10 && Math.random()<0.5 ? 2 : 1; for(let i=0;i<n;i++) S.raids.push(rnd(40,DAYLEN-30)); }
  S.kl={x:1010,job:null,t:0}; S.jobs=[]; S.ask=null; S.fire=null; S.rush=[];
  S.fireAt = S.day>=2 && Math.random()<Math.min(0.8,0.35+S.day*0.03) ? rnd(35,DAYLEN-40) : null;
  // Darius-Panne
  if (S.day>=3 && Math.random()<0.06){ const n=Math.floor(stockCount('huhn')*0.3); if(n>0){ takeStock('huhn',n); S.day_.waste.huhn+=n; S.day_.why.verdorben+=n; sayM('DARIUS hat die Kühlung ausgesteckt. Wieso darf der überhaupt ins Lager?'); log(`Darius hat die Kühlung ausgesteckt: ${n} Hühner verdorben.`);} }
  sayM(first?'Willkommen bei LS-Chicken. Ich bin Maddin. Hier wird geliefert.':isNight()?pick(SAY_M.night):pick(SAY_M.start));
  log(isNight()?`Nachtschicht Lagerhalle: ${S.night.workers} Leute, ${S.night.portions} Portionen bestellt und bezahlt. Pausen um 00:00 und 03:00.`:`Tag ${S.day}: ${S.event.name}`);
  hideAll(); paused=false;
}

function endDay(reason){
  if (S.phase!=='day') return;
  S.phase='bon';
  for(const x of (S.rush||[])) S.stock[x.p].push({q:x.q,age:0,cheap:false}); S.rush=[];
  if (S.kl.job){ finishSale(S.kl.job); S.kl.job=null; } S.jobs.splice(0).forEach(finishSale);
  const d=S.day_;
  const toss=(p,n,why)=>{ if(n>0){ d.waste[p]+=n; d.why[why]+=n; } };
  // Spieß: gare Ware wandert in die Auslage-Reste
  for(const it of S.spiess){ if(!it) continue; const c=COOK[it.p]; if(it.t>=c.done && it.t<c.burn) S.aus[it.p].push({perf:false,age:0,re:false,cheap:it.cheap}); else toss(it.p,1, it.t>=c.burn?'verbrannt':'uebrig'); }
  S.spiess=[];
  for(const w of S.rost){ if(w) toss('wurst',1,'uebrig'); } S.rost=[];
  for(const b of S.fry){ if(b) toss('pommes',POMMES_BATCH,'uebrig'); } S.fry=[];
  for(const p of ['huhn','haxe']){
    const keep=[];
    for(const it of S.aus[p]){ if(S.reheat && !it.re) keep.push({perf:false,age:0,re:true,cheap:it.cheap}); else toss(p,1,'uebrig'); }
    S.aus[p]=keep;
  }
  for(const p of ['wurst','pommes','salat']){ toss(p,S.aus[p].length,'uebrig'); S.aus[p]=[]; }
  // Rohware altert
  for(const p of P){ for(const b of S.stock[p]) b.age++; const bad=S.stock[p].filter(b=>b.age>=SPOIL[p]); for(const b of bad) toss(p,b.q,'verdorben'); S.stock[p]=S.stock[p].filter(b=>b.age<SPOIL[p]); }
  // Nachtschicht: Pauschale der Firma, Vertragsstrafe für Fehlendes
  if (isNight() && S.night){
    const N=S.night, missing=Math.max(0,N.portions-d.delivered);
    const avgP = N.value/NIGHT_ZULAGE/Math.max(1,N.portions);
    d.night={value:N.value, missing, delivered:d.delivered, portions:N.portions, workers:N.workers,
             penalty:Math.round(missing*avgP*NIGHT_PENALTY*100)/100, bonus: missing===0 ? Math.round(N.value*NIGHT_BONUS*100)/100 : 0};
    d.night.payout=Math.max(0, d.night.value-d.night.penalty)+d.night.bonus;
    d.revenue=d.night.payout; S.cash+=d.night.payout;
    S.ruf=clamp(S.ruf+(missing===0?4:missing<=N.portions*0.1?1:-3),0,100);
  }
  // Kosten
  const c=d.cost;
  c.stand = isNight() ? 0 : 50 + S.day*4;   // nachts stellt die Firma den Platz
  c.energie = 15 + (S.up.spiess+S.up.rost)*2 + S.up.fry*8;
  c.auto = S.auto ? 60 : 0;
  c.strafe = 0;
  if (d.reheatSold>0 && Math.random()<Math.min(0.85,0.12*d.reheatSold)){ c.strafe = 120+S.day*10; S.ruf=clamp(S.ruf-15,0,100); d.kontrolle=true; }
  const sum = c.stand+c.energie+c.auto+c.strafe;
  S.cash -= sum;
  d.costSum=sum; d.cashEnd=S.cash; d.ruf=S.ruf; d.event=S.event.name;
  // Tracking
  for(const p of P){ S.run.sold[p]+=d.sold[p]; S.run.waste[p]+=d.waste[p]; STORE.life.sold[p]+=d.sold[p]; STORE.life.waste[p]+=d.waste[p]; }
  S.run.revenue+=d.revenue; S.run.served+=d.served; S.run.lost+=d.lost+d.missed; S.run.stolen+=d.why.gestohlen;
  STORE.life.revenue+=d.revenue; STORE.life.days++; STORE.life.served+=d.served; STORE.life.lost+=d.lost+d.missed; STORE.life.stolen+=d.why.gestohlen;
  S.hist.push({n:d.n, sold:{...d.sold}, waste:{...d.waste}, revenue:d.revenue, ev:S.event.id});
  if (S.hist.length>30) S.hist.shift();
  S.over = reason==='ruf' || S.ruf<=0 ? 'ruf' : S.cash<0 ? 'pleite' : null;
  // Prognose für morgen
  S.day++;
  const pool=EVENTS.filter(e=>!e.minDay||e.minDay<=S.day);
  S.forecast = Math.random()<0.45 ? EVENTS[0] : pick(pool);
  if (isNightDay(S.day)){ S.forecast = NIGHT; S.night = makeContract(S.day); }
  if (S.over){ recordBest(); STORE.run=null; } else { STORE.run=S; }
  saveStore();
  d.reviews=genReviews(d); for(const rv of d.reviews){ S.revSum+=rv.st; S.revN++; }
  fbDay(d);
  showBon(d);
}

function recordBest(){
  STORE.best.push({days:S.day-1, revenue:Math.round(S.run.revenue), date:new Date().toLocaleDateString('de-DE')});
  STORE.best.sort((a,b)=>b.days-a.days||b.revenue-a.revenue); STORE.best=STORE.best.slice(0,8);
}

/* ===================== Kundschaft ===================== */
const CURVE=[0.6,0.9,1.7,1.5,0.8,0.7,1.0,1.4]; const CMEAN=CURVE.reduce((a,b)=>a+b)/CURVE.length;
function custPerDay(){ return (16 + S.day*2.2) * S.event.cust * (0.5+S.ruf/100) * (1+S.up.schild*0.12) * custMult(); }
function weightOf(p,base){ return base*(S.event.mult[p]??1)*demandMult(p); }
function makeOrder(){
  const o={};
  const mains=[['huhn',45],['wurst',30],['haxe',12],['salat',13]].map(([p,w])=>[p,weightOf(p,w)]);
  let tot=mains.reduce((a,b)=>a+b[1],0), r=Math.random()*tot, m='huhn';
  for(const [p,w] of mains){ if((r-=w)<=0){m=p;break;} }
  o[m]= (S.day>=5 && Math.random()<0.15) ? 2 : 1;
  if (Math.random()<0.6*(S.event.mult.pommes??1)*demandMult('pommes') && m!=='salat') o.pommes=(o.pommes||0)+1;
  else if (Math.random()<0.18*(S.event.mult.salat??1)*demandMult('salat')) o.salat=(o.salat||0)+1;
  if (S.day>=1){ const wm=0.17*(S.event.mult.monster??1)*demandMult('monster'), wf=0.17*(S.event.mult.faxe??1)*demandMult('faxe'), q=Math.random(); if(q<wm) o.monster=1; else if(q<wm+wf) o.faxe=1; }
  return o;
}
function makeNightOrder(){
  const o={}, r=Math.random();
  const m = r<0.48?'huhn': r<0.72?'wurst': r<0.90?'haxe':'salat';
  o[m] = Math.random()<0.18 ? 2 : 1;
  if (m!=='salat' && Math.random()<0.65) o.pommes=1;
  if (Math.random()<0.55) o.monster = Math.random()<0.25 ? 2 : 1;      // Nachtschicht = Monster
  return o;
}
function makeContract(day){
  const workers = Math.round(20 + day*1.3);
  const orders=[]; const tot=Object.fromEntries(P.map(p=>[p,0]));
  for(let k=0;k<workers;k++){
    const o=makeNightOrder(); for(const [p,n] of Object.entries(o)) tot[p]+=n;
    const w=Math.random(); const t = w<0.38 ? rnd(52,78) : w<0.76 ? rnd(142,168) : rnd(8,DAYLEN-25);   // Pausen um 00:00 und 03:00
    orders.push({o,t});
  }
  orders.sort((a,b)=>a.t-b.t);
  const value = Object.entries(tot).reduce((a,[p,n])=>a+n*PRICE[p]*NIGHT_ZULAGE,0);
  return {day, workers, orders, tot, value:Math.round(value*100)/100, portions:Object.values(tot).reduce((a,b)=>a+b,0)};
}
const portionsOf = o => Object.values(o).reduce((a,b)=>a+b,0);
function spawnNight(){
  const N=S.night; if(!N) return;
  while(N.next<N.orders.length && N.orders[N.next].t<=S.time && S.queue.length<QMAX){
    const ord=N.orders[N.next++];
    S.queue.push({o:{...ord.o}, pat:45, max:45, spr:Math.random()<0.35?'wBlue':'wHappy', bob:rnd(0,6), x:W+60});
  }
}
function spawnCustomer(){
  if (S.queue.length>=QMAX){ S.day_.missed++; S.ruf=clamp(S.ruf-1,0,100); return; }
  const pat=Math.max(20,40-S.day*0.4);
  S.queue.push({o:makeOrder(), pat, max:pat, spr:Math.random()<0.35?'wBlue':'wHappy', bob:rnd(0,6), x:W+60});
}
const avail = p => isDrink(p) ? stockCount(p) : S.aus[p].length;
const takeReady = p => isDrink(p) ? (takeStock(p,1), {perf:true,age:0}) : S.aus[p].shift();
const canServe = c => !c.res && Object.entries(c.o).every(([p,n])=>avail(p)>=n);
function reserve(c){
  if(!c||!canServe(c)) return false;
  c.items=[]; for(const [p,n] of Object.entries(c.o)) for(let k=0;k<n;k++) c.items.push([p,takeReady(p)]);
  c.res=true; S.jobs.push(c); return true;
}
function serve(i){ return reserve(S.queue[i]); }
// ausverkauft = nichts im Lager, nichts in der Auslage, nichts auf dem Feuer
function cookingCount(p){
  if (p==='huhn'||p==='haxe') return S.spiess.filter(it=>it&&it.p===p&&it.t<COOK[p].burn).length;
  if (p==='wurst') return S.rost.filter(w=>w&&!w.burnt).length;
  if (p==='pommes') return S.fry.filter(b=>b&&b.t<COOK.pommes.burn).length;
  return S.salatPrep>0?1:0;
}
const soldOut = p => isDrink(p) ? stockCount(p)===0 : stockCount(p)===0 && S.aus[p].length===0 && cookingCount(p)===0;
const partialCount = c => Object.entries(c.o).reduce((a,[p,n])=>a+Math.min(n,avail(p)),0);
function servePartial(c){
  if(!c||c.res) return false;
  c.items=[]; for(const [p,n] of Object.entries(c.o)){ const m=Math.min(n,avail(p)); for(let k=0;k<m;k++) c.items.push([p,takeReady(p)]); }
  if(!c.items.length) return false;
  c.res=true; c.partial=true; S.jobs.push(c); return true;
}
function sendAway(c){
  const i=S.queue.indexOf(c); if(i<0||c.res) return;
  S.queue.splice(i,1); S.day_.refused++; if(!isNight()) S.ruf=clamp(S.ruf-1.5,0,100);
  float(qx(i),560,'Sorry, aus!',C.mayo); say('d',pick(['Is aus. Komm morgen wieder.','Hamwa nich mehr. Sorry, Chef.','Ausverkauft… glaub isch.']));
}
function finishSale(c){
  if (isNight()){
    const i=S.queue.indexOf(c), x=i>=0?qx(i):S.kl.x;
    let allPerf=true;
    for(const [p,it] of c.items){ if(!it.perf) allPerf=false; S.day_.sold[p]++; S.day_.delivered++; }
    if (c.partial) S.day_.partial++;
    S.day_.served++;
    if (allPerf && !c.partial) S.fuel=clamp(S.fuel+5,0,100);
    float(x,500,c.partial?'Teil geliefert':'geliefert ✓',c.partial?C.grill:C.phos);
    if (i>=0) S.queue.splice(i,1);
    return;
  }
  const i=S.queue.indexOf(c), x=i>=0?qx(i):S.kl.x;
  let sum=0, allPerf=true, cheap=0, re=0;
  let pRuf=0;
  for(const [p,it] of c.items){ sum+=pr(p); pRuf+=priceRuf(p); if(!it.perf) allPerf=false; if(it.cheap) cheap++; if(it.re) re++; S.day_.sold[p]++; }
  const tip = allPerf && !c.partial ? sum*0.15 : 0;
  if (c.partial){ S.day_.partial++; }
  S.cash+=sum+tip; S.day_.revenue+=sum+tip; S.day_.tips+=tip; S.day_.served++; S.day_.reheatSold+=re;
  S.ruf=clamp(S.ruf+(c.partial?-1:allPerf?1.2:0.4)+pRuf,0,100);
  if (allPerf && !c.partial){ S.fuel=clamp(S.fuel+5,0,100); }
  if (cheap>0 && Math.random()<0.18*cheap){ S.ruf=clamp(S.ruf-3,0,100); S.day_.complaints++; float(x,480,'Schmeckt komisch…',C.ketchup); }
  float(x,500,'+'+eur(sum+tip)+(c.partial?' (Teil)':allPerf?' ★':''),c.partial?C.grill:allPerf?C.phos:C.mayo);
  if (i>=0) S.queue.splice(i,1);
}
const QX=[205,318,431,544,862,975];
const qx = i => QX[Math.min(i,QX.length-1)];

/* ===================== Aktionen ===================== */
function loadSpiess(p,slot){
  const i=Number.isInteger(slot)?slot:firstFree(S.spiess,S.up.spiess); if(i<0){ float(318,240,'Spieß voll',C.ketchup); return; }
  const s=takeStock(p,1); if(!s){ float(318,240,`Keine ${RAW[p]} mehr!`,C.ketchup); return; }
  S.spiess[i]={p,t:0,cheap:s.cheap};
}
function loadRost(slot){
  const i=Number.isInteger(slot)?slot:firstFree(S.rost,S.up.rost); if(i<0){ float(541,290,'Rost voll',C.ketchup); return; }
  if(!takeStock('wurst',1)){ float(541,290,'Keine Würste mehr!',C.ketchup); return; }
  S.rost[i]={t:0,side:1,pf:false,burnt:false};
}
function loadFry(){
  const i=firstFree(S.fry,S.up.fry); if(i<0){ float(679,280,'Fritteuse belegt',C.ketchup); return; }
  if(!takeStock('pommes',1)){ float(679,280,'Keine Pommes mehr!',C.ketchup); return; }
  S.fry[i]={t:0};
}
function prepSalat(){
  if (S.salatPrep>0) return;
  if(!takeStock('salat',1)){ float(777,312,'Kein Salat mehr!',C.ketchup); return; }
  S.salatPrep=SALAT_PREP;
}
function notPrice(p){ return Math.round(NOTPACK[p]*buyPrice(p,true)*2*100)/100; }
function rushPending(p){ return S.rush.find(x=>x.p===p); }
function emergency(p){
  if (rushPending(p)){ float(640,640,'Peter ist schon unterwegs',C.mayo); return; }
  const cost=notPrice(p);
  if (S.cash<cost){ float(640,640,'Kein Geld für die Notlieferung',C.ketchup); return; }
  S.cash-=cost; S.day_.notfall+=cost; S.day_.notfallN++;
  S.rush.push({p,q:NOTPACK[p],t:NOT_ETA});
  log(`Notlieferung: Peter bringt ${NOTPACK[p]} ${RAW[p]} ${isDrink(p)?NAME[p]:''} in ${NOT_ETA} s (${eur(cost)}, doppelter Preis).`);
  sayM(pick(['Notlieferung?! Zum doppelten Preis? Planung ist für dich ein Fremdwort.','Peter freut sich. Ich nicht.','Wer hat bestellt? Du. Wer zahlt? Wir.']));
}
function firstFree(arr,n){ for(let i=0;i<n;i++) if(!arr[i]) return i; return -1; }

function takeSpiess(i){
  const it=S.spiess[i]; if(!it) return;
  const c=COOK[it.p], sx=slotSpiess(i);
  if (it.t<c.done){ float(sx.x+sx.w/2,sx.y,'noch roh',C.dim); return; }
  S.spiess[i]=null;
  if (it.t>=c.burn){ burnt(it.p,1,sx.x+sx.w/2,sx.y); return; }
  const perf=it.t<=c.perf;
  S.aus[it.p].push({perf,age:0,re:false,cheap:it.cheap});
  goodTake(perf,sx.x+sx.w/2,sx.y-4);
}
function clickRost(i){
  const w=S.rost[i]; if(!w) return; const r=slotRost(i);
  if (w.burnt){ S.rost[i]=null; burnt('wurst',1,r.x+r.w/2,r.y); return; }
  if (w.side===1){ if(w.t>=WURST.side){ w.side=2; w.pf=w.t<=WURST.perfFlip; w.t=0; } else float(r.x+r.w/2,r.y-4,'zu früh',C.dim); return; }
  if (w.t<WURST.side){ float(r.x+r.w/2,r.y-4,'noch nicht',C.dim); return; }
  S.rost[i]=null; const perf=w.pf && w.t<=WURST.perf;
  S.aus.wurst.push({perf,age:0}); goodTake(perf,r.x+r.w/2,r.y-4);
}
function flipAll(){ S.rost.forEach((w,i)=>{ if(w&&w.side===1&&!w.burnt&&w.t>=WURST.side) clickRost(i); }); }
function clickFry(i){
  const b=S.fry[i], r=slotFry(i);
  if(!b){ if(i<S.up.fry) loadFry(); return; }
  const c=COOK.pommes;
  if (b.t<c.done){ float(r.x+r.w/2,r.y,'noch nicht',C.dim); return; }
  S.fry[i]=null;
  if (b.t>=c.burn){ burnt('pommes',POMMES_BATCH,r.x+r.w/2,r.y); return; }
  const perf=b.t<=c.perf; for(let k=0;k<POMMES_BATCH;k++) S.aus.pommes.push({perf,age:0});
  goodTake(perf,r.x+r.w/2,r.y-6);
}
function goodTake(perf,x,y){
  if (perf){ S.fuel=clamp(S.fuel+8,0,100); S.day_.perfect++; S.streak++; float(x,y,'PERFEKT',C.phos); if(S.streak%5===0) sayM(pick(SAY_M.praise)); }
  else { S.streak=0; float(x,y,'ok',C.mayo); }
}
function burnt(p,n,x,y){ S.day_.waste[p]+=n; S.day_.why.verbrannt+=n; S.streak=0; float(x,y,'VERBRANNT',C.ketchup); S.ruf=clamp(S.ruf-0.5,0,100); sayM(pick(SAY_M.burn)); }
function wartime(){ if(S.fuel>=100 && S.wt<=0){ S.fuel=0; S.wt=WT_DUR; sayM(pick(SAY_M.wt)); } }

/* ===================== Update ===================== */
let sprays=[];
let say_m={t:0,txt:''}, say_d={t:0,txt:''}, floats=[], ticker='';
function sayM(t){ if(S&&S.day_) S.day_.shouts++; say_m={t:3.2,txt:t}; maddinPose = SAY_M.praise.includes(t)?'maddinEat' : ['lost','burn','raid','kloska','queue','low','fire'].some(k=>SAY_M[k]&&SAY_M[k].includes(t))?'maddinPoint':'maddinShout'; }
function say(who,t){ if(who==='d') say_d={t:3,txt:t}; else sayM(t); }
function log(t){ ticker=t; }
function float(x,y,txt,col){ if(floats.length>30) floats.shift(); floats.push({x,y,txt,col,t:1.1}); }

let maddinPose='maddinEat';
function update(dt){
  if (S.phase!=='day') return;
  const d=S.day_;
  const sp = S.wt>0 ? 1.6 : 1, csp = S.fire ? 0 : sp;  // csp: Garen steht, solange die Gasflasche brennt
  S.time+=dt;
  if (S.wt>0) S.wt-=dt;
  // Spawn
  const hour=Math.min(7,Math.floor(S.time/(DAYLEN/8)));
  if (isNight()) spawnNight();
  else { S.spawnAcc += dt * custPerDay()/DAYLEN * CURVE[hour]/CMEAN;
  while(S.spawnAcc>=1){ S.spawnAcc-=1; spawnCustomer(); } }
  // Garen
  for(const it of S.spiess) if(it) it.t+=dt*csp;
  for(const w of S.rost) if(w&&!w.burnt){ w.t+=dt*csp; if(w.side===1&&w.t>=WURST.flipLate) w.burnt=true; if(w.side===2&&w.t>=WURST.burn) w.burnt=true; }
  for(const b of S.fry) if(b) b.t+=dt*csp;
  if (S.salatPrep>0){ S.salatPrep-=dt*sp; if(S.salatPrep<=0){ S.salatPrep=0; S.aus.salat.push({perf:true,age:0}); } }
  // Auslage altert
  const lf = S.up.lamp ? 1.6 : 1;
  for(const p of ['pommes','wurst']){
    for(const it of S.aus[p]) it.age+=dt;
    const lim=LASCH[p]*lf, before=S.aus[p].length;
    S.aus[p]=S.aus[p].filter(it=>it.age<lim);
    const n=before-S.aus[p].length; if(n>0){ d.waste[p]+=n; d.why.lasch+=n; { const ar=ausRect(FOOD.indexOf(p)); float(ar.x+ar.w/2,ar.y-6,`${n}× lasch`,C.ketchup); }; }
  }
  // Schlange
  for(let i=0;i<S.queue.length;i++){
    const c=S.queue[i]; const tx=qx(i); c.x += (tx-c.x)*Math.min(1,dt*6);
    if (S.wt<=0 && !c.res) c.pat-=dt;
    if (c.pat<=0){ S.queue.splice(i,1); i--; d.lost++; if(!isNight()) S.ruf=clamp(S.ruf-4,0,100); S.streak=0; sayM(pick(SAY_M.lost)); float(tx,560,'WEG!',C.ketchup); }
  }
  if (S.queue.length>=5 && say_m.t<=0 && Math.random()<dt*0.4) sayM(pick(SAY_M.queue));
  // Kloska am Tresen
  const k=S.kl;
  if (!k.job && S.jobs.length){ k.job=S.jobs.shift(); k.t=0; k.thrown=false; }
  if (k.job){
    k.t+=dt*sp;
    if (k.t>=0.3 && !k.thrown){ k.thrown=true; const i=S.queue.indexOf(k.job); for(const [p] of k.job.items) flies.push({p,x0:KLOSKA_X,y0:COUNTER_Y-30,x1:i>=0?qx(i):KLOSKA_X,y1:590,t:0}); }
    if (k.t>=0.65){ finishSale(k.job); k.job=null; k.thrown=false; if(Math.random()<0.12) say('d',pick(SAY_K_OK)); }
  }
  if (S.auto){
    S.aCd-=dt;
    if (S.aCd<=0){
      S.aCd=3.2;
      const i=S.queue.findIndex(canServe);
      if (i>=0){
        if (Math.random() < 0.84+S.up.schul*0.04) reserve(S.queue[i]);
        else {
          const p=pick(FOOD.filter(p=>S.aus[p].length>0));
          S.aus[p].shift(); d.waste[p]++; d.why.kloska++; S.ruf=clamp(S.ruf-2,0,100);
          say('d',pick(SAY_K)); float(qx(i),490,`Kloska: falsches ${NAME[p]}`,C.ketchup);
          if (Math.random()<0.5) setTimeout(()=>sayM(pick(SAY_M.kloska)),700);
        }
      }
    }
  }
  // Notlieferungen kommen an
  for(const x of S.rush){ x.t-=dt; if(x.t<=0){ S.stock[x.p].push({q:x.q,age:0,cheap:false}); float(isDrink(x.p)?703:118+FOOD.indexOf(x.p)*232+60,isDrink(x.p)?470:650,`+${x.q} ${RAW[x.p]}`,C.phos); log(`Peter ist da: ${x.q} ${RAW[x.p]} ${isDrink(x.p)?NAME[x.p]:''} geliefert.`); } }
  S.rush=S.rush.filter(x=>x.t>0);
  // Gasflasche
  if (S.fireAt!=null && S.time>=S.fireAt && !S.fire){ S.fireAt=null; S.fire={hp:5,max:5,t:0}; d.fires++; sayM(pick(SAY_M.fire)); log('Die Gasflasche brennt! Anklicken zum Löschen, bis dahin brät nichts.'); }
  if (S.fire){ S.fire.t+=dt; if (S.fire.t>8) S.ruf=clamp(S.ruf-0.5*dt,0,100); if (say_m.t<=0 && Math.random()<dt*0.35) sayM(pick(SAY_M.fire)); }
  for(const p of sprays) p.t+=dt; sprays=sprays.filter(p=>p.t<0.6);
  if (S.ask){ S.ask.t-=dt; if(S.ask.t<=0||!S.queue.includes(S.ask.c)||S.ask.c.res) S.ask=null; }
  // Max & Moritz
  if (S.raids.length && S.time>=S.raids[0] && !S.raid){ S.raids.shift(); S.raid={t:5}; sayM(pick(SAY_M.raid)); log('Max und Moritz klettern auf den Wagen! Anklicken!'); }
  if (S.raid){
    S.raid.t-=dt;
    if (S.raid.t<=0){
      let stolen=0;
      for(let k=0;k<2;k++){
        if (S.aus.huhn.length){ S.aus.huhn.pop(); stolen++; continue; }
        const j=S.spiess.findIndex(it=>it&&it.p==='huhn'); if(j>=0){ S.spiess[j]=null; stolen++; }
      }
      d.waste.huhn+=stolen; d.why.gestohlen+=stolen; S.raid=null;
      float(320,150,stolen?`${stolen} Hähnchen geklaut!`:'Nichts zu holen',C.ketchup); log(stolen?`Max und Moritz haben ${stolen} Hähnchen erbeutet.`:'Max und Moritz ziehen leer ab.');
    }
  }
  // Sprech-Timer, Floats
  say_m.t-=dt; say_d.t-=dt;
  for(const f of floats){ f.t-=dt; f.y-=dt*28; } floats=floats.filter(f=>f.t>0);
  for(const fl of flies) fl.t+=dt; flies=flies.filter(fl=>fl.t<0.35);
  if (S.ruf<=0){ endDay('ruf'); return; }
  if (S.time>=DAYLEN) endDay();
}

/* ===================== Layout (Koordinaten auf dem Hintergrundbild, 1280×720) ===================== */

function slotRost(i){ const c=i%4, r=Math.floor(i/4); return {x:465+c*39, y:272+r*37, w:38, h:33}; }

function slotFry(i){ return {x:[640,681][i], y:290, w:37, h:38}; }

const GAS={x:1016,y:430,w:64,h:132};
const SALAD={x:742,y:316,w:70,h:44};                         // freie Arbeitsfläche hinter Kloska

/* ===================== Rendering ===================== */
const cv=document.getElementById('cv'), ctx=cv.getContext('2d');
let dpr=1;
function fit(){
  const vw=innerWidth-34, vh=innerHeight-26, s=Math.min(vw/W, vh/H);
  cv.style.width=Math.floor(W*s)+'px'; cv.style.height=Math.floor(H*s)+'px';
  dpr=Math.min(2,(window.devicePixelRatio||1)*Math.max(1,s));
  cv.width=Math.round(W*dpr); cv.height=Math.round(H*dpr);
}
addEventListener('resize',fit);
const iconCache={};
function icon(p,s){
  const k=p+s; if(iconCache[k]) return iconCache[k];
  const c=document.createElement('canvas'); c.width=c.height=Math.ceil(s*1.2*2);
  const x=c.getContext('2d'); x.scale(2,2); x.textAlign='center'; x.textBaseline='middle';
  x.font=`${s}px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif`; x.fillText(EMO[p],s*0.6,s*0.65);
  return iconCache[k]=c;
}
function drawCan(p,cx,cy,s){
  const w=s*0.52, h=s*0.92, x=cx-w/2, y=cy-h/2;
  ctx.fillStyle='rgba(0,0,0,.35)'; rr(x+2,y+2,w,h,3); ctx.fill();
  if (p==='monster'){ ctx.fillStyle='#f4f4f0'; rr(x,y,w,h,3); ctx.fill(); ctx.fillStyle='#1d1d1d'; ctx.fillRect(x,y+h*0.12,w,h*0.1); ctx.fillRect(x,y+h*0.78,w,h*0.1);
    ctx.strokeStyle='#9aa0a6'; ctx.lineWidth=Math.max(1,s/18); for(let k=-1;k<=1;k++){ ctx.beginPath(); ctx.moveTo(cx+k*w*0.2,y+h*0.3); ctx.lineTo(cx+k*w*0.2+w*0.06,y+h*0.68); ctx.stroke(); } ctx.lineWidth=1; }
  else { ctx.fillStyle='#c9ced4'; rr(x,y,w,h,3); ctx.fill(); ctx.fillStyle='#1f4fa3'; ctx.fillRect(x,y+h*0.22,w,h*0.5); ctx.fillStyle='#d1342b'; ctx.fillRect(x,y+h*0.42,w,h*0.1);
    ctx.fillStyle='#fff'; ctx.font=`700 ${Math.max(6,s*0.2)}px ${F.disp}`; ctx.textAlign='center'; ctx.fillText('10%',cx,y+h*0.38); }
  ctx.fillStyle='#8d949b'; ctx.fillRect(x+w*0.1,y,w*0.8,Math.max(1.5,h*0.05));
}
function drawIcon(p,cx,cy,s,dark){
  if (isDrink(p)) return drawCan(p,cx,cy,s);
  const c=icon(p,s), w=s*1.2;
  ctx.drawImage(c,cx-w/2,cy-w/2,w,w);
  if (dark>0){ ctx.globalAlpha=dark; ctx.fillStyle='#1a0d05'; ctx.beginPath(); ctx.arc(cx,cy,s*0.42,0,7); ctx.fill(); ctx.globalAlpha=1; }
}
function txt(t,x,y,size,col,align='left',font=F.body,weight=600){ ctx.font=`${weight} ${size}px ${font}`; ctx.fillStyle=col; ctx.textAlign=align; ctx.textBaseline='alphabetic'; ctx.fillText(t,x,y); }
function txtS(t,x,y,size,col,align='left',font=F.body,weight=700){ ctx.font=`${weight} ${size}px ${font}`; ctx.textAlign=align; ctx.textBaseline='alphabetic'; ctx.fillStyle='rgba(0,0,0,.75)'; ctx.fillText(t,x+1.5,y+1.5); ctx.fillStyle=col; ctx.fillText(t,x,y); }
function rr(x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
// Garbalken: grau roh, grün perfekt, orange ok, rot verbrannt
function cookBar(x,y,w,t,done,perf,burn,h=4){
  const tot=burn*1.15, sx=v=>x+w*Math.min(1,v/tot);
  ctx.fillStyle='rgba(0,0,0,.6)'; ctx.fillRect(x-1,y-1,w+2,h+2);
  ctx.fillStyle='#596566'; ctx.fillRect(x,y,sx(done)-x,h);
  ctx.fillStyle=C.phos; ctx.fillRect(sx(done),y,sx(perf)-sx(done),h);
  ctx.fillStyle=C.grill; ctx.fillRect(sx(perf),y,sx(burn)-sx(perf),h);
  ctx.fillStyle=C.ketchup; ctx.fillRect(sx(burn),y,x+w-sx(burn),h);
  ctx.fillStyle='#fff'; ctx.fillRect(sx(t)-1,y-2,2,h+4);
}
function glow(r,col,pulse){ const a=pulse?0.55+0.45*Math.sin(performance.now()/120):1; ctx.globalAlpha=a; ctx.strokeStyle=col; ctx.lineWidth=2; ctx.strokeRect(r.x+1,r.y+1,r.w-2,r.h-2); ctx.lineWidth=1; ctx.globalAlpha=1; }
function bubble(x,y,w,h,text,tail){
  ctx.fillStyle=C.paper; rr(x,y,w,h,6); ctx.fill();
  ctx.strokeStyle='rgba(42,38,34,.5)'; ctx.stroke();
  ctx.beginPath(); ctx.fillStyle=C.paper;
  if(tail==='down'){ ctx.moveTo(x+w-70,y+h); ctx.lineTo(x+w-58,y+h+14); ctx.lineTo(x+w-48,y+h); }
  if(tail==='left'){ ctx.moveTo(x,y+h-26); ctx.lineTo(x-14,y+h-12); ctx.lineTo(x,y+h-12); }
  ctx.fill();
  ctx.font=`600 15px ${F.body}`; ctx.fillStyle=C.ink; ctx.textAlign='left'; ctx.textBaseline='alphabetic';
  wrap(text,x+10,y+21,w-20,18);
}
function wrap(t,x,y,maxW,lh){ const words=t.split(' '); let line=''; for(const w of words){ const tst=line?line+' '+w:w; if(ctx.measureText(tst).width>maxW&&line){ ctx.fillText(line,x,y); line=w; y+=lh; } else line=tst; } ctx.fillText(line,x,y); }
function hudLabel(t,x,col){ txt(t,x,17,10,col||'#c9a77a','left',F.disp,700); }

let hover=-1, mouse={x:-99,y:-99}, tip='';
let flies=[];
function render(){
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.fillStyle=C.bg; ctx.fillRect(0,0,W,H);
  if (!S) return;
  const now=performance.now(), wt=S.wt>0;
  if (isNight() && IMG.bgNight && IMG.bgNight.complete && IMG.bgNight.naturalWidth) ctx.drawImage(IMG.bgNight,0,0,W,H);
  else if (IMG.bg.complete){ ctx.drawImage(IMG.bg,0,0,W,H);
    if (isNight()){   // Platzhalter, bis das Lagerhallen-Bild da ist: Nacht drüberlegen, Wagen bleibt warm beleuchtet
      ctx.fillStyle='rgba(6,10,30,.68)'; ctx.fillRect(0,0,W,250); ctx.fillRect(0,250,150,470); ctx.fillRect(1020,250,260,470); ctx.fillRect(150,465,870,255);
      ctx.fillStyle='rgba(6,10,30,.18)'; ctx.fillRect(150,250,870,215);
      ctx.save(); ctx.globalCompositeOperation='lighter';
      for(const [lx,ly] of [[1180,90],[60,80]]){ const g=ctx.createRadialGradient(lx,ly,0,lx,ly+260,360); g.addColorStop(0,'rgba(255,150,50,.22)'); g.addColorStop(1,'rgba(255,150,50,0)'); ctx.fillStyle=g; ctx.fillRect(lx-360,0,720,720); }
      ctx.restore(); } }
  // Schild auf dem Dach
  txtS('LS-CHICKEN',577,124,46,C.mayo,'center',F.disp,700);
  if (wt){ ctx.fillStyle=`rgba(217,71,47,${0.10+0.06*Math.sin(now/90)})`; ctx.fillRect(0,0,W,H); }

  /* --- Spieß --- */
  for(let i=0;i<12;i++){
    const r=slotSpiess(i), locked=i>=S.up.spiess, it=S.spiess[i], hv=hover===300+i;
    if (locked){ ctx.fillStyle='rgba(10,6,4,.55)'; ctx.fillRect(r.x,r.y,r.w,r.h); continue; }
    if (!it){ if(hv){ ctx.globalAlpha=.45; drawIcon('huhn',r.x+r.w/2,r.y+r.h/2,24,0); ctx.globalAlpha=1; glow(r,C.mayo); } continue; }
    const c=COOK[it.p], burnt=it.t>=c.burn;
    drawIcon(it.p,r.x+r.w/2,r.y+r.h/2-2,it.p==='haxe'?26:28, burnt?0.85:Math.max(0,(it.t/c.burn-0.75))*0.6);
    cookBar(r.x+6,r.y+r.h-5,r.w-12,it.t,c.done,c.perf,c.burn,3);
    if (burnt) glow(r,C.ketchup,true); else if (it.t>=c.done) glow(r,it.t<=c.perf?C.phos:C.grill,it.t<=c.perf);
    if (hv) glow(r,C.mayo);
  }
  /* --- Grillrost (Bildfelder klein, Klickflächen groß) --- */
  { const ready=S.rost.some(w=>w&&!w.burnt&&w.side===1&&w.t>=WURST.side), b=BTN.flip, on=hover===3;
    ctx.globalAlpha = ready ? .8+.2*Math.sin(now/120) : .55;
    ctx.fillStyle=on?'#4a3322':'rgba(20,12,8,.85)'; rr(b.x,b.y,b.w,b.h,11); ctx.fill(); ctx.strokeStyle=ready?C.phos:'rgba(240,160,58,.45)'; ctx.stroke();

function hitTest(p){

  if (S.fire && inR(p,GAS)) return ['gas'];
  if (inR(p,SALAD)) return ['salad'];
  for(const d of DRINKS) if(inR(p,FRIDGE[d])) return ['crate',d];
  if (inR(p,BTN.pause)) return ['pause'];
  if (inR(p,BTN.music)) return ['music'];
  if (inR(p,BTN.wt)) return ['wt'];
  if (S.raid && inR(p,BTN.raid)) return ['raid'];
  if (inR(p,BTN.kaffee)) return ['kaffee'];
  for(let i=0;i<12;i++) if(inR(p,slotSpiess(i))) return i<S.up.spiess ? [S.spiess[i]?'spiess':'spLoad',i] : ['locked',i,'Spieß'];
  if (inR(p,BTN.flip)) return ['flip'];
  for(let i=0;i<8;i++) if(inR(p,hitRost(i))) return i<S.up.rost ? [S.rost[i]?'rost':'rostLoad',i] : ['locked',i,'Grillrost'];
  for(let i=0;i<2;i++) if(inR(p,slotFry(i))) return i<S.up.fry ? ['fry',i] : ['locked',i,'Fritteuse'];
  for(let i=0;i<5;i++) if(inR(p,lagerBtn(i))) return ['lager',i];
  for(let i=0;i<S.queue.length;i++) if(inR(p,custRect(i))) return ['cust',i];

    case 'rost': { const w=S.rost[i]; return w.burnt?'Schwarz: anklicken zum Wegwerfen':w.side===1?(w.t>=WURST.side?'Jetzt wenden!':'Seite 1 brät'):(w.t>=WURST.side?'Runternehmen':'Seite 2 brät'); }
    case 'fry': { const b=S.fry[i]; if(!b) return 'Klick: 1 Portion Pommes rein'; return b.t>=COOK.pommes.burn?'Verbrannt: wegwerfen':b.t>=COOK.pommes.done?'Pommes raus!':`noch ${Math.ceil(COOK.pommes.done-b.t)} s`; }

    case 'lager': { const p=FOOD[i]; if(rushPending(p)) return `Peter ist unterwegs: ${Math.ceil(rushPending(p).t)} s`; if(stockCount(p)===0) return `Notlieferung: ${NOTPACK[p]} ${RAW[p]} für ${eur(notPrice(p))} (doppelter Preis), kommt in ${NOT_ETA} s`; return ['Hähnchen auf den Spieß','Haxe auf den Spieß (45 s)','Bratwurst auf den Rost','Pommes in die Fritteuse','Salat anrichten (hinter Kloska)'][i]; }
    case 'salad': return S.salatPrep>0?'Salat wird angerichtet…':stockCount('salat')?'Klick: Salat anrichten':'Kein Salat mehr im Lager';
    case 'crate': { const n=stockCount(i); if(rushPending(i)) return `Peter bringt ${NAME[i]}: ${Math.ceil(rushPending(i).t)} s`; return n?`${NAME[i]}: ${n} Dosen im Kühlschrank, Kloska nimmt sie direkt mit`:`${NAME[i]} leer. Klick: Notlieferung ${NOTPACK[i]} Dosen für ${eur(notPrice(i))}`; }
    case 'cust': { const c=S.queue[i]; return c.res?'Kloska verkauft gerade':canServe(c)?'Klick: Kloska verkauft':'Unvollständig. Klick: Teillieferung oder wegschicken'; }
    case 'aus': return `${NAME[P[i]]} in der Auslage`;
    case 'kaffee': return S.fuel>=100?'Kaffee! Wartime zünden':`Wartime lädt: ${Math.round(S.fuel)} %`;
    case 'wt': return S.fuel>=100?'Wartime zünden':'Lädt durch perfekt gegarte Ware';
    case 'raid': return 'Max und Moritz verjagen!';
    case 'pause': return 'Pause';
    case 'music': return musicOn?'Musik aus':'Musik an';
    case 'gas': return `Feuer löschen (${S.fire.hp}× klicken)`;
    case 'ask': return i===0?'Teillieferung: nur was da ist, ohne Trinkgeld, Ruf −1':'Nichts verkaufen und wegschicken, Ruf −1,5';
    case 'flip': return 'Alle wendebereiten Würste wenden';
  }

}
function hoverCode(h){

}

}

}

/* ===================== Loop ===================== */
let paused=false, last=performance.now(), acc=0; const STEP=1/60;
function frame(now){
  let dt=(now-last)/1000; last=now; if(dt>0.25) dt=0.25;
  if (!paused && S && S.phase==='day'){ acc+=dt; while(acc>=STEP){ update(STEP); acc-=STEP; } } else acc=0;
  render();
  requestAnimationFrame(frame);
}
function togglePause(force){
  paused = force ?? !paused;
  const o=$('ovPause');
  if (paused){ o.innerHTML=`<div class="card" style="max-width:420px"><div class="stack"><h2>PAUSE</h2><p class="dim">Der Spieß dreht sich nicht weiter. Maddin wartet.</p><div class="row"><button class="btn go" id="bResume">Weiter</button></div></div></div>`; o.hidden=false; $('bResume').onclick=()=>togglePause(false); $('bResume').focus(); }
  else o.hidden=true;
}

    ${rv.map(x=>`<div class="rv"><div class="who"><span class="av" style="background:${x.col}">${esc(x.name[0])}</span><div><b>${esc(x.name)}</b><div class="meta"><span class="stars">${starsHtml(x.st)}</span> · ${x.ago}</div></div></div><p>${esc(x.txt)}</p></div>`).join('')}
  </div>`;
  show('ovBon',`<div class="stack" style="align-items:center;width:100%"><div class="bonrow">
   <div class="bon">
    <div class="c"><b style="font-size:18px">LS-CHICKEN</b><br>${d.night?'Nachtschicht · Lagerhalle Hamm-Rhynern':'Grillwagen · Markt Hamm-Rhynern'}<br>Tag ${d.n} · ${d.event}</div><hr>
    ${d.night?`<div class="l"><span>Sammelbestellung Firma</span><span>${d.night.portions} Port.</span></div>
      <div class="l"><span>Geliefert</span><span>${d.night.delivered} Port.</span></div><hr>
      <div class="l"><span>Pauschale inkl. Nachtzulage</span><span>${eur(d.night.value)}</span></div>
      ${d.night.penalty?`<div class="l"><span>Vertragsstrafe (${d.night.missing} fehlen)</span><span class="neg">${eur(-d.night.penalty)}</span></div>`:''}
      ${d.night.bonus?`<div class="l"><span>Bonus: alles geliefert</span><span>${eur(d.night.bonus)}</span></div>`:''}`
    : (lines||'<div class="c">Nichts verkauft.</div>')}
    ${d.tips>0?`<div class="l"><span>Trinkgeld (perfekt)</span><span>${eur(d.tips)}</span></div>`:''}
    <hr><div class="l big"><span>UMSATZ</span><span>${eur(d.revenue)}</span></div><hr>
    ${c.stand?`<div class="l"><span>Standgebühr</span><span class="neg">${eur(-c.stand)}</span></div>`:''}
    <div class="l"><span>Gas & Strom</span><span class="neg">${eur(-c.energie)}</span></div>
    ${!c.stand&&d.night?'<div class="l"><span>Standgebühr</span><span>übernimmt Firma</span></div>':''}
    ${c.auto?`<div class="l"><span>Kloska Autopilot (Überstunden)</span><span class="neg">${eur(-c.auto)}</span></div>`:''}
    ${c.strafe?`<div class="l"><span>Bußgeld Lebensmittelkontrolle</span><span class="neg">${eur(-c.strafe)}</span></div>`:''}
    ${d.notfall?`<div class="l"><span>${d.notfallN}× Notlieferung (2× Preis)</span><span class="neg">${eur(-d.notfall)}</span></div>`:''}
    <hr><div class="l big"><span>KASSE</span><span class="${d.cashEnd<0?'neg':''}">${eur(d.cashEnd)}</span></div>
    <div class="l"><span>Tagesergebnis</span><span>${eur(d.revenue-d.costSum-d.notfall)}</span></div><hr>
    <div class="l"><span>Bedient</span><span>${d.served}</span></div>
    <div class="l"><span>Weggelaufen</span><span>${d.lost}</span></div>
    <div class="l"><span>Schlange voll, abgedreht</span><span>${d.missed}</span></div>
    <div class="l"><span>Perfekt gegart</span><span>${d.perfect}</span></div>
    ${d.partial?`<div class="l"><span>Teillieferungen</span><span>${d.partial}</span></div>`:''}
    ${d.refused?`<div class="l"><span>Weggeschickt (ausverkauft)</span><span>${d.refused}</span></div>`:''}
    ${d.fires?`<div class="l"><span>Gasflaschen-Brände</span><span>${d.fires}</span></div>`:''}
    ${d.complaints?`<div class="l"><span>Beschwerden Sonderposten</span><span>${d.complaints}</span></div>`:''}
    <div class="l"><span>Ruf</span><span>${Math.round(d.ruf)}/100</span></div><hr>
    <div class="l"><b>VERLUSTE</b><b>${P.reduce((a,p)=>a+d.waste[p],0)} Stk.</b></div>
    ${P.filter(p=>d.waste[p]>0).map(p=>`<div class="l"><span>${d.waste[p]} × ${NAME[p]}</span><span class="neg">${eur(-d.waste[p]*BUY[p])}</span></div>`).join('')}
    ${why}
    ${d.kontrolle?'<hr><div class="c"><b>KONTROLLE!</b> Aufgewärmte Ware gefunden. Ruf −15.</div>':''}
    <hr><div class="c">Vielen Dank für Ihren Einkauf.<br>Maddin sieht alles.</div>
   </div>${revHtml}</div>
   <button class="btn go" id="bBon">${S.over?'Abrechnung lesen':'Weiter zu Peter'}</button></div>`);
  $('bBon').onclick=()=>S.over?showOver():showEvening();
  $('bBon').focus();
}

function buyPrice(p,plain){ return BUY[p]*Math.pow(1.012,S.day-1)*(!plain&&p==='huhn'&&S.cheapNext?0.65:1); }
function upPrice(k){ const u=UPG[k]; return Math.round(u.base*0.5*Math.pow(1.5,S.upBought[k])); }  // 50 % günstiger
function upMaxed(k){ const u=UPG[k]; return k==='kuehl'? S.up.kuehl>=u.max : S.up[k]>=u.max; }

function showEvening(){
  S.phase='evening';
  // auch alte Spielstände (vor dem Nachtschicht-Update gespeichert) bekommen die Ankündigung
  if (isNightDay(S.day) && (!S.night || S.night.day!==S.day)){ S.forecast=NIGHT; S.night=makeContract(S.day); }
  if (!S.order) S.order=blank();
  const last7=S.hist.slice(-7);
  const avg=p=>last7.length?last7.reduce((a,h)=>a+h.sold[p],0)/last7.length:0;
  const peterSays = pick(['Na, Junge. Was brauchst du für morgen?','Frische Ware, ehrliche Preise. Meistens.','Ich hab noch Sonderposten Hühner. Frag nicht, woher.','Bestell lieber zu viel als zu wenig. Sagt Maddin. Ich sag nichts.']);
  const html=()=>{
    const tot=P.reduce((a,p)=>a+S.order[p]*buyPrice(p),0);
    const space=S.up.kuehl-stockTotal(), ordered=P.reduce((a,p)=>a+S.order[p],0);
    return `<div class="card"><div class="grid2">
    <div class="stack">
      <h2>FEIERABEND · TAG ${S.day-1} VORBEI</h2>
      <div class="peter"><img src="${IMG_SRC.peter}" alt="Peter vom Großmarkt"><div class="speech"><b>Peter vom Großmarkt:</b> ${peterSays}</div></div>
      ${S.forecast.id==='nacht'&&S.night?`<div class="night"><h3>Morgen: Nachtschicht Lagerhalle</h3>
        <p>Die Firma hat den Wagen für ${S.night.workers} Leute bestellt. Alles ist schon bezahlt, wir müssen nur liefern. Pausen um 00:00 und 03:00.</p>
        <p class="dim" style="font-size:13px;margin-top:6px">Sammelbestellung: ${P.filter(p=>S.night.tot[p]>0).map(p=>`<b style="color:var(--mayo)">${S.night.tot[p]}</b> ${EMO[p]} ${SHORT[p]||NAME[p]}`).join(' · ')}</p>
        <p class="dim" style="font-size:13px;margin-top:6px">Pauschale inkl. Nachtzulage: <b style="color:var(--phos)">${eur(S.night.value)}</b>. Jede fehlende Portion kostet Vertragsstrafe, alles geliefert gibt +10 % Bonus. Faxe ist verboten, Arbeitsschutz.</p></div>`
      :`<div><h3>Prognose für Tag ${S.day}</h3><p class="fc">${S.forecast.name}</p><p class="dim" style="font-size:13px">Quelle: Darius' Wetter-App. Trefferquote etwa 80 %.${fcHint()}</p>${isNightDay(S.day+1)?'<p class="dim" style="font-size:13px">Übermorgen ist Nachtschicht in der Lagerhalle.</p>':''}</div>`}
      <h3>Bestellung (Lieferung morgen früh)</h3>
      <div class="tbl"><table>
        <thead><tr><th>Ware</th><th>Letzte 7 Tage</th><th>Ø/Tag</th><th>Lager</th><th>Bestellen</th><th>Preis</th></tr></thead>
        <tbody>${P.map(p=>`<tr>
          <td>${EMO[p]} ${SHORT[p]||NAME[p]}</td>
          <td><div class="spark" title="Verkauft pro Tag">${sparkBars(p,last7)}</div></td>
          <td>${avg(p).toFixed(1)}</td>
          <td>${stockCount(p)}${S.stock[p].some(b=>b.age>=SPOIL[p]-1)?' <span style="color:var(--ketchup)">!</span>':''}</td>
          <td><div class="row" style="gap:4px;flex-wrap:nowrap;justify-content:flex-end"><button class="btn sm" data-q="${p}" data-d="-5">−5</button><button class="btn sm" data-q="${p}" data-d="-1">−</button><input class="qty" id="q_${p}" data-p="${p}" inputmode="numeric" value="${S.order[p]}"><button class="btn sm" data-q="${p}" data-d="1">+</button><button class="btn sm" data-q="${p}" data-d="5">+5</button></div></td>
          <td>${eur(buyPrice(p))}</td></tr>`).join('')}</tbody></table></div>
      <label class="tog"><input type="checkbox" id="cbCheap" ${S.cheapNext?'checked':''}><span><b>Peters Sonderposten-Hühner</b> (−35 %). Manche Kunden merken es. Ruf leidet.</span></label>
      <div><div class="row" style="justify-content:space-between"><span class="dim">Kühlung nach Lieferung</span><span>${stockTotal()+ordered} / ${S.up.kuehl}</span></div>
        <div class="bar ${ordered>space?'warn':''}"><i style="width:${Math.min(100,(stockTotal()+ordered)/S.up.kuehl*100)}%"></i></div>
        <p class="dim" style="font-size:12.5px;margin-top:4px">Haltbarkeit roh: Salat 2 Tage, Hühner und Haxen 4, Würste 5, Pommes 7. Getränke halten ewig.</p></div>
      <div class="row" style="justify-content:space-between"><span>Bestellung: <b>${eur(tot)}</b> · Kasse danach: <b style="color:${S.cash-tot<0?'var(--ketchup)':'var(--phos)'}">${eur(S.cash-tot)}</b></span>
        <button class="btn go" id="bStart" ${S.cash-tot<0||ordered>space?'disabled':''}>Tag ${S.day} starten</button></div>
      ${ordered>space?'<p style="color:var(--ketchup);font-size:13px">Zu viel für die Kühlung. Weniger bestellen oder Kühlzelle kaufen.</p>':''}
      ${S.cash-tot<0?'<p style="color:var(--ketchup);font-size:13px">Peter liefert nicht auf Pump.</p>':''}
    </div>
    <div class="stack">
      <h3>Verkaufspreise</h3>
      <div class="tbl"><table class="ptbl"><thead><tr><th>Ware</th><th>Dein Preis</th><th>Marge</th><th>Kundschaft</th></tr></thead><tbody>
      ${P.map(p=>{ const ratio=pRatio(p), f=priceFeel(ratio), m=pr(p)-buyPrice(p,true), dm=Math.round((demandMult(p)-1)*100);
        return `<tr><td>${EMO[p]} ${SHORT[p]||NAME[p]}</td>
        <td><div class="row" style="gap:3px;flex-wrap:nowrap;justify-content:flex-end"><button class="btn sm" data-pp="${p}" data-d="-0.5">−</button><input class="qty" style="width:64px" id="pp_${p}" data-p="${p}" inputmode="decimal" value="${pr(p).toFixed(2).replace('.',',')}"><button class="btn sm" data-pp="${p}" data-d="0.5">+</button></div></td>
        <td style="color:${m<0?'var(--ketchup)':'var(--fg)'}" title="Verkaufspreis minus Einkauf (${eur(buyPrice(p,true))})">${eur(m)}</td>
        <td title="Nachfrage nach diesem Produkt"><span class="chip" style="color:${f.c};border-color:${f.c}">${f.t}</span><div class="dim" style="font-size:11.5px;text-align:right">Nachfrage ${dm>0?'+':''}${dm} %</div></td></tr>`; }).join('')}
      </tbody></table></div>
      ${(()=>{ const ks=kundenScore(), cm=Math.round((custMult()-1)*100), col=ks>=70?'var(--phos)':ks>=45?'var(--grill)':'var(--ketchup)';
        const verdict = ks>=85?'Die Würmer stehen Schlange. Marge eher dünn.':ks>=70?'Passt. Keiner meckert, alle zahlen.':ks>=45?'Einige murren an der Theke. Ruf sinkt leicht pro Verkauf.':ks>=25?'Abzocke-Alarm. Weniger Kundschaft, schlechtere Bewertungen.':'Die Würmer gehen lieber zum Döner.';
        return `<div><div class="row" style="justify-content:space-between"><span><b>Kunden-Score</b> <span class="dim" style="font-size:12.5px">· wie die Preise ankommen</span></span><b style="color:${col}">${ks} / 100</b></div>
        <div class="bar ${ks<45?'warn':''}"><i style="width:${ks}%;background:${col}"></i></div>
        <p class="dim" style="font-size:12.5px;margin-top:4px">${verdict} Kundschaft morgen ${cm>0?'+':''}${cm} % durch die Preise.</p>
        <div class="row" style="margin-top:6px"><button class="btn sm" id="bPriceStd">Standardpreise</button></div></div>`; })()}
      <h3>Wagen aufrüsten</h3>
      <div>${Object.keys(UPG).map(k=>{ const u=UPG[k], mx=upMaxed(k), pr=upPrice(k); const lvl=k==='kuehl'?`${S.up.kuehl} Einh.`:k==='schul'?`Stufe ${S.up.schul}`:k==='spiess'||k==='rost'?`${S.up[k]} Plätze`:k==='fry'?`${S.up.fry} Korb`:`Stufe ${S.up[k]}`;
          return `<div class="up"><div><b>${u.name}</b> <span class="dim" style="font-size:12.5px">· ${lvl}</span><small>${u.desc}</small></div><button class="btn sm" data-up="${k}" ${mx||S.cash<pr||(k==='schul'&&!S.auto)?'disabled':''}>${mx?'max':eur(pr)}</button></div>`; }).join('')}</div>
      <h3>Personal & Risiko</h3>
      <div class="peter" style="align-items:center"><img src="${IMG_SRC.kloska}" alt="Kloska" style="height:110px">
        <label class="tog"><input type="checkbox" id="cbAuto" ${S.auto?'checked':''}><span><b>Kloska Autopilot</b> (60 € Überstunden pro Tag). Kloska verkauft selbstständig, sobald eine Bestellung komplett ist. Verwechselt dabei aktuell ${Math.round((0.16-S.up.schul*0.04)*100)} %. Ohne Autopilot verkauft er nur auf deinen Klick, dafür fehlerfrei.</span></label></div>
      <label class="tog"><input type="checkbox" id="cbReheat" ${S.reheat?'checked':''}><span><b>Reste-Hähnchen aufwärmen</b>: Übrige Hähnchen und Haxen gehen morgen wieder in die Auslage statt in den Müll. Je mehr davon verkauft werden, desto wahrscheinlicher kommt die Kontrolle.</span></label>
      <h3>Verlauf</h3>
      <div class="tbl"><table><thead><tr><th>Tag</th><th>Umsatz</th>${P.map(p=>`<th>${EMO[p]}</th>`).join('')}<th>Verlust</th></tr></thead>
      <tbody>${S.hist.slice(-7).reverse().map(h=>`<tr><td>${h.n}</td><td>${eur(h.revenue)}</td>${P.map(p=>`<td>${h.sold[p]}</td>`).join('')}<td>${P.reduce((a,p)=>a+h.waste[p],0)}</td></tr>`).join('')||'<tr><td colspan="8" class="dim">Noch keine Tage.</td></tr>'}</tbody></table></div>
      <p class="dim" style="font-size:13px">Dieser Run: ${S.run.served} bedient · ${P.map(p=>`${S.run.sold[p]} ${NAME[p]}`).join(' · ')}</p>
    </div></div></div>`;
  };
  const draw=()=>{
    const focus=document.activeElement&&document.activeElement.id;
    show('ovEve',html());
    $('ovEve').querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{ const p=b.dataset.q; S.order[p]=Math.max(0,S.order[p]+(+b.dataset.d)); draw(); });
    $('ovEve').querySelectorAll('.qty').forEach(inp=>inp.onchange=()=>{ const v=parseInt(inp.value,10); S.order[inp.dataset.p]=Number.isFinite(v)&&v>0?v:0; draw(); });
    $('ovEve').querySelectorAll('[data-up]').forEach(b=>b.onclick=()=>buyUp(b.dataset.up,draw));
    $('cbCheap').onchange=e=>{ S.cheapNext=e.target.checked; draw(); };
    const setP=(p,v)=>{ S.price[p]=Math.round(clamp(v,PRICE[p]*0.5,PRICE[p]*2.5)*10)/10; };
    $('ovEve').querySelectorAll('[data-pp]').forEach(b=>b.onclick=()=>{ const p=b.dataset.pp; setP(p,pr(p)+(+b.dataset.d)); draw(); });
    $('ovEve').querySelectorAll('[id^="pp_"]').forEach(inp=>inp.onchange=()=>{ const v=parseFloat(String(inp.value).replace(',','.')); if(Number.isFinite(v)) setP(inp.dataset.p,v); draw(); });
    $('bPriceStd').onclick=()=>{ S.price={...PRICE}; draw(); };
    $('cbAuto').onchange=e=>{ S.auto=e.target.checked; draw(); };
    $('cbReheat').onchange=e=>{ S.reheat=e.target.checked; };
    $('bStart').onclick=()=>{ const tot=P.reduce((a,p)=>a+S.order[p]*buyPrice(p),0); S.cash-=tot; STORE.run=null; saveStore(); startDay(false); };
    if (focus&&$(focus)) $(focus).focus();
  };
  draw();
}
function fcHint(){ if(!S.forecast.mult) return ''; const m=S.forecast.mult, parts=Object.entries(m).map(([p,v])=>`${NAME[p]} ${v>1?'↑':'↓'}`); const cu=S.forecast.cust; return (cu!==1?` Kundschaft ${cu>1?'↑':'↓'}.`:'')+(parts.length?' '+parts.join(', ')+'.':''); }
function sparkBars(p,h){ const mx=Math.max(1,...h.map(d=>d.sold[p])); return h.map(d=>`<i style="height:${Math.max(4,d.sold[p]/mx*100)}%"></i>`).join('')||'<span class="dim">–</span>'; }
function buyUp(k,redraw){
  const pr=upPrice(k); if(S.cash<pr||upMaxed(k)) return;
  S.cash-=pr; S.upBought[k]++; S.up[k]+=UPG[k].step; redraw();
}

function showOver(){
  recordBestSafe();
  const L=STORE.life, r=S.run;
  const reason = S.over==='ruf' ? 'Dein Ruf ist bei null. Niemand kauft mehr bei LS-Chicken.' : 'Die Kasse ist im Minus. Peter liefert nicht mehr, der Wagen wird abgeschleppt.';
  show('ovOver',`<div class="card" style="max-width:760px"><div class="stack">
    <div class="peter"><img src="${IMG_SRC.maddinPoint}" alt="Maddin" style="height:160px"><div class="speech"><b>Maddin:</b> ${S.over==='ruf'?'Den Ruf kriegst du nicht mit Rabatt zurück.':'Pleite. In meiner Schicht. Unfassbar.'}</div></div>
    <h2>AUS NACH ${S.day-1} ${S.day-1===1?'TAG':'TAGEN'}</h2>
    <p>${reason}</p>
    <div class="tbl"><table><thead><tr><th></th>${P.map(p=>`<th>${EMO[p]} ${NAME[p]}</th>`).join('')}</tr></thead><tbody>
      <tr><td>Verkauft (Run)</td>${P.map(p=>`<td>${r.sold[p]}</td>`).join('')}</tr>
      <tr><td>Verlust (Run)</td>${P.map(p=>`<td>${r.waste[p]}</td>`).join('')}</tr>
      <tr><td>Verkauft (gesamt)</td>${P.map(p=>`<td>${L.sold[p]}</td>`).join('')}</tr>
      <tr><td>Verlust (gesamt)</td>${P.map(p=>`<td>${L.waste[p]}</td>`).join('')}</tr>
    </tbody></table></div>
    <p class="dim">Run: ${eur(r.revenue)} Umsatz · ${r.served} bedient · ${r.lost} verloren · ${r.stolen} Hähnchen an Max & Moritz.</p>
    <h3>Rangliste · alle Kollegen</h3>
    <div id="lscBoard2"></div>
    <h3>Bestenliste (dieser Browser)</h3>
    <div class="tbl"><table><thead><tr><th>#</th><th>Tage</th><th>Umsatz</th><th>Datum</th></tr></thead><tbody>
    ${STORE.best.map((b,i)=>`<tr><td>${i+1}</td><td>${b.days}</td><td>${eur(b.revenue)}</td><td>${b.date}</td></tr>`).join('')}</tbody></table></div>
    <div class="row"><button class="btn go" id="bAgain">Neuer Run</button><button class="btn" id="bMenu">Titel</button>${IN_TS?'<button class="btn" id="bBack2">Zurück zu Ticket Slayer</button>':''}</div>
  </div></div>`);
  renderBoard($('lscBoard2')); $('bAgain').onclick=newRun; $('bMenu').onclick=showTitle; if(IN_TS) $('bBack2').onclick=backToTS;
}
function recordBestSafe(){ /* bereits in endDay erfasst */ }

/* ===================== Hot reload & Start ===================== */
window.claude?.hot?.snapshot?.(()=>({S, phase:S&&S.phase}));
function boot(data){
  fit(); fbLoadMine();
  if (data && data.S){ S=data.S; if(S.phase==='day'){ hideAll(); togglePause(true); } else if(S.phase==='evening') showEvening(); else showTitle(); }
  else if (!tsAccess()) showGate();
  else showTitle();
  requestAnimationFrame(frame);
}
const startFn = ()=>{ (document.fonts?document.fonts.ready:Promise.resolve()).then(()=>boot(window.claude?.hot?.data)); };
window.claude?.hot?.ready ? window.claude.hot.ready(d=>{ (document.fonts?document.fonts.ready:Promise.resolve()).then(()=>boot(d)); }) : startFn();
</script>
