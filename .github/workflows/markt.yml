name: Peters Marktbericht
on:
  schedule:
    - cron: "15 3 * * *"     # täglich 03:15 UTC. Die Challenge-Werte friert der erste Lauf jeder Woche ein.
  workflow_dispatch:
permissions:
  contents: write
jobs:
  markt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/markt.py
      - name: Commit markt.json
        run: |
          git config user.name "markt-bot"
          git config user.email "actions@users.noreply.github.com"
          git add markt.json
          git diff --cached --quiet || git commit -m "Marktbericht $(date +%G-W%V)"
          git push
